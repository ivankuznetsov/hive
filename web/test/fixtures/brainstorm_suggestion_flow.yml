storyboard:
  - Candidate and controller-derived sources render as escaped text.
  - Approve copies the exact candidate body while persisted answers stay empty.
  - A hard reload retains approval; Undo restores the operator draft.
  - A newer binding cannot overwrite or discard the older binding's draft.
  - Decline hides presentation only; Restore reveals it with the draft unchanged.
  - Send answers is the sole action that persists the approved body.
