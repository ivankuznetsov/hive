schema: "hive-module/v1"
name: "architecture-patrol"
version: "0.1.0"
description: "First-party current-main and merged-PR Architecture Patrol adapter"
type: "architecture-patrol"
author:
  name: "Hive"
  url: "https://hivecli.sh"
license: "MIT"
hive_min_version: "0.6.7"
source:
  url: "https://github.com/ivankuznetsov/hive"
  revision: "913c11a83e892792354f612ea47b27d868ad0e6b"
workflows: []
hooks:
  -
    id: "setup"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.setup"
    default_enabled: true
    schedules: []
    events:
      - "project.registered"
    concurrency: "drop"
  -
    id: "scheduled-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.scheduled-discovery"
    default_enabled: false
    schedules:
      - "*/10 * * * *"
    events: []
    concurrency: "drop"
  -
    id: "merged-pr-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.merged-pr-discovery"
    default_enabled: false
    schedules: []
    events:
      - "pull_request.merged"
    concurrency: "drop"
  -
    id: "actions"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.actions"
    default_enabled: false
    schedules:
      - "*/10 * * * *"
    events: []
    concurrency: "drop"
settings:
  -
    name: "shadow_mode"
    type: "boolean"
    required: true
    default: true
    description: "Evaluate without claiming or invoking Architecture Patrol work"
  -
    name: "dry_run"
    type: "boolean"
    required: true
    default: false
    description: "Retain the legacy Architecture Patrol dry-run execution mode"
permissions:
  repository_write: true
  github_mutations:
    - "issues"
    - "pull_requests"
  external_commands:
    - "gh"
    - "git"
  network_hosts:
    - "api.github.com"
  filesystem_read:
    - "repository"
  filesystem_write:
    - ".hive-state/refactor_patrol/**"
    - ".hive-state/stages/**"
  secrets: []
templates:
  - "templates/refactor-patrol.yml"
docs:
  - "README.md"
files:
  "README.md": "ececda34faa53626eed7eef2c3c84f4cc5f77a697c955d5fb0c1d70fa38ef9f6"
  "templates/refactor-patrol.yml": "dc64ee66282374b8cc39c4769c005c1649982739e91fb4686cc0ffa04ebaac42"
release_sha256: "2035bba347f77a8077bdb0510b8eda52acb5d0967a5bb47ee2745322d8f8ef5e"
