name: full_pipeline_happy_path
description: Real bin/hive subprocess flow from inbox to done without network PR creation.
tags: [happy-path, cli-only]
coverage:
  primary: workflow.full_pipeline
  supporting: []
steps:
  - kind: cli
    args: [new, "{project}", "demo idea"]
  - kind: ruby_block
    block: |
      path = File.join(sandbox, ".hive-state", "config.yml")
      config = YAML.safe_load(File.read(path))
      config.fetch("review")["github_checks"] = { "enabled" => false }
      File.write(path, config.to_yaml)
  - kind: cli
    args: [brainstorm, "{slug}", --from, 1-inbox]
    env:
      HIVE_FAKE_CLAUDE_WRITE_FILE: "{task_dir:2-brainstorm}/brainstorm.md"
      HIVE_FAKE_CLAUDE_WRITE_CONTENT: "# Brainstorm\n\n## Requirements\n\nShip the demo pipeline.\n\n<!-- COMPLETE -->\n"
  - kind: state_assert
    path: "{task_dir:2-brainstorm}/brainstorm.md"
    marker: { current: COMPLETE }
  - kind: cli
    args: [plan, "{slug}", --from, 2-brainstorm]
    env:
      HIVE_FAKE_CLAUDE_WRITE_FILE: "{task_dir:3-plan}/plan.md"
      HIVE_FAKE_CLAUDE_WRITE_CONTENT: "# Plan\n\n<!-- COMPLETE -->\n"
  - kind: state_assert
    path: "{task_dir:3-plan}/plan.md"
    marker: { current: COMPLETE }
  - kind: cli
    args: [develop, "{slug}", --from, 3-plan]
    env:
      HIVE_FAKE_CLAUDE_COMMIT_FILE: implementation.txt
      HIVE_FAKE_CLAUDE_COMMIT_CONTENT: "implemented\n"
      HIVE_FAKE_CLAUDE_COMMIT_MESSAGE: "feat: implement e2e fixture"
  - kind: state_assert
    path: "{task_dir:4-execute}/task.md"
    marker: { current: EXECUTE_COMPLETE }
  # AC1: PR-first pipeline routes through 5-open-pr BEFORE 6-review.
  # Seed PR creation, then exercise real Git publication over loopback with
  # exact scripted GitHub identity responses. No hosted PR is created.
  - kind: cli
    args: [approve, "{slug}", --from, 4-execute, --to, 5-open-pr]
  - kind: write_file
    path: "{task_dir:5-open-pr}/pr.md"
    content: "---\npr_url: https://127.0.0.1/acme/app/pull/1\npr_number: 1\n---\n\n<!-- COMPLETE pr_url=https://127.0.0.1/acme/app/pull/1 is_draft=true -->\n"
  - kind: ruby_block
    block: |
      require_relative "../lib/git_remote"
      root = File.join(run_home, "remote")
      bare = File.join(root, "acme", "app.git")
      FileUtils.mkdir_p(File.dirname(bare))
      system("git", "init", "--bare", "--quiet", bare, exception: true)
      remote = Hive::E2E::GitRemote.new(root: root)
      (@ctx.harness_state[:background] ||= {})["git-remote"] = remote
      system("git", "-C", sandbox, "remote", "add", "origin", remote.url, exception: true)
      folder = File.join(sandbox, ".hive-state", "stages", "5-open-pr", slug)
      worktree = YAML.safe_load_file(File.join(folder, "worktree.yml")).fetch("path")
      head, status = Open3.capture2("git", "-C", worktree, "rev-parse", "HEAD")
      raise "missing review head" unless status.success?
      system("git", "-C", worktree, "push", "--quiet", "origin", "HEAD:refs/heads/#{slug}", exception: true)
      url = "https://127.0.0.1/acme/app/pull/1"
      metadata = { "number" => 1, "url" => url, "baseRefName" => "master", "headRefOid" => head.strip,
        "isCrossRepository" => false, "state" => "OPEN", "isDraft" => true }
      identity = [
        { "args" => ["auth", "status"] },
        { "args" => ["pr", "view", "1", "--json", "number,url,baseRefName,headRefOid,isCrossRepository,state,isDraft"], "response" => metadata },
        { "args" => ["pr", "list", "--head", slug, "--state", "all", "--json", "url,number,state,isDraft,headRefName,headRefOid,body,baseRefName,baseRefOid,headRepository"],
          "response" => [metadata.merge("headRefName" => slug)] }
      ]
      @gh_stub.install(identity * 3)
  - kind: cli
    args: [review, "{slug}", --from, 5-open-pr]
  - kind: state_assert
    path: "{task_dir:6-review}/task.md"
    marker: { current: REVIEW_COMPLETE }
  # AC: the workflow inserts 7-artifacts between review and finalize. Exercise
  # the real three-role controller and its retained/reviewed document proof.
  - kind: cli
    args: [artifacts, "{slug}", --from, 6-review]
  - kind: state_assert
    path: "{task_dir:7-artifacts}/artifact.md"
    marker: { current: COMPLETE }
  - kind: cli
    args: [approve, "{slug}", --from, 7-artifacts, --to, 8-finalize]
  - kind: write_file
    path: "{task_dir:8-finalize}/pr.md"
    content: "# PR\n\n<!-- COMPLETE pr_url=https://127.0.0.1/acme/app/pull/1 -->\n"
  - kind: cli
    args: [archive, "{slug}", --from, 8-finalize]
  - kind: json_assert
    args: [task, "{slug}", --project, "{project}", --json]
    schema: hive-task-workspace
    pick: [task, stage]
    equals: 9-done
