schema_version: 1
profiles:
  release:
    description: Blocking semantic E2E proof for a Hive release candidate.
coverage:
  - id: attempt.terminal_replay
    title: Durable attempt terminal replay
    description: A CLI-originated multi-commit attempt survives caller loss and reaches one terminal receipt.
    maturity: required
    profiles: [release]
    constraints: { platforms: [linux], providers: [] }
    docs: [wiki/e2e.md]
    code: [test/e2e/scenarios/durable_attempt_1849_replay.yml]
  - id: workflow.full_pipeline
    title: Full workflow pipeline
    description: The real CLI advances a task from inbox through the complete coding workflow.
    maturity: required
    profiles: [release]
    constraints: { platforms: [], providers: [] }
    docs: [wiki/e2e.md]
    code: [test/e2e/scenarios/full_pipeline_happy_path.yml]
  - id: module.lifecycle_install
    title: Module installation lifecycle
    description: Reviewed first-party modules activate project-locally and expose one shared redacted CLI and web status.
    maturity: required
    profiles: [release]
    constraints: { platforms: [], providers: [] }
    docs: [docs/modules.md, wiki/e2e.md]
    code: [test/e2e/scenarios/module_fresh_install.yml]
  - id: module.lifecycle_disable_uninstall
    title: Module disable and uninstall lifecycle
    description: Disable, re-enable, and uninstall preserve tombstones and no-replay watermarks.
