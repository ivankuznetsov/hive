schema: "hive-module/v1"
name: "architecture-patrol"
version: "0.1.0"
description: "First-party current-main and merged-PR Architecture Patrol adapter"
type: "architecture-patrol"
author:
  name: "Hive"
  url: "https://hivecli.sh"
license: "MIT"
hive_min_version: "0.6.7"
source:
  url: "https://github.com/ivankuznetsov/hive"
  revision: "913c11a83e892792354f612ea47b27d868ad0e6b"
workflows: []
hooks:
  -
    id: "setup"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.setup"
    default_enabled: true
    schedules: []
    events:
      - "project.registered"
    concurrency: "drop"
  -
    id: "scheduled-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.scheduled-discovery"
    default_enabled: false
    schedules:
      - "*/10 * * * *"
    events: []
    concurrency: "drop"
  -
    id: "merged-pr-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.merged-pr-discovery"
    default_enabled: false
    schedules: []
    events:
      - "pull_request.merged"
    concurrency: "drop"
  -
    id: "actions"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.actions"
    default_enabled: false
    schedules:
      - "*/10 * * * *"
    events: []
    concurrency: "drop"
settings:
  -
    name: "shadow_mode"
    type: "boolean"
    required: true
    default: true
    description: "Evaluate without claiming or invoking Architecture Patrol work"
  -
    name: "dry_run"
    type: "boolean"
    required: true
    default: false
    description: "Retain the legacy Architecture Patrol dry-run execution mode"
permissions:
  repository_write: true
  github_mutations:
    - "pull_requests"
  external_commands:
    - "gh"
    - "git"
  network_hosts:
    - "api.github.com"
  filesystem_read:
    - "repository"
  filesystem_write:
    - ".hive-state/refactor_patrol/**"
    - ".hive-state/stages/**"
  secrets: []
templates:
  - "templates/refactor-patrol.yml"
docs:
  - "README.md"
files:
  "README.md": "fdf5913e5e37c2b9cf8895be0cdd26aca9424b25f8bb855bdcc7c5ec46613747"
  "templates/refactor-patrol.yml": "2cc38868acdd2c1db566a024c976b1ab4a68c8fc9d53cddb2bdae26249816da5"
release_sha256: "7c9ba3a9567e2c8d22299c0301e4435e34b1bbc1f4060ad1f90793fc465a960b"
