services:
  hivebox:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only: an unclaimed box is claimed by the FIRST GitHub
      # login, so it must not face the LAN until ownership is pinned.
      # Publish wider ("4567:4567") only behind a trusted proxy/tunnel or
      # after setting `web.github.owner` in the bind-mounted config.yml.
      - "127.0.0.1:4567:4567"
    volumes:
      - ./hivebox-data:/data
    environment:
      # GitHub sign-in uses the OAuth *device flow*: no client secret and no
      # callback URL exist. Configure `web.github.owner` in the bind-mounted
      # config.yml; the default client_id is the shared hivebox OAuth app.
      HIVEBOX_SESSION_SECRET: "${HIVEBOX_SESSION_SECRET:-}"
