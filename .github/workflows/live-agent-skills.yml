name: Live agent skills proof

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full protected-main commit SHA to prove
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-agent-skills-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected-main candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      workflow_revision: ${{ steps.candidate.outputs.workflow_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate dispatch and candidate trust
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/live-agent-skills.yml@refs/heads/main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "proof must be dispatched from refs/heads/main" >&2
            exit 1
          }
          [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]] || {
            echo "untrusted workflow revision: $GITHUB_WORKFLOW_REF" >&2
            exit 1
          }
          [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "candidate_sha must be a full 40-character SHA" >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          candidate_sha="$(git rev-parse "${INPUT_CANDIDATE_SHA}^{commit}")"
          [[ "${INPUT_CANDIDATE_SHA,,}" == "$candidate_sha" ]] || {
            echo "candidate_sha did not resolve exactly" >&2
            exit 1
          }
          git merge-base --is-ancestor "$candidate_sha" refs/remotes/origin/main || {
            echo "candidate is not reachable from protected main" >&2
            exit 1
          }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')" == "true" ]] || {
            echo "repository main branch is not protected" >&2
            exit 1
          }
          workflow_revision="$(git rev-parse HEAD)"
          [[ "$workflow_revision" == "$GITHUB_SHA" ]] || {
            echo "workflow checkout does not match the dispatch revision" >&2
            exit 1
          }
          {
            echo "candidate_sha=$candidate_sha"
            echo "workflow_revision=$workflow_revision"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build exact candidate artifacts once
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build exact gem, source, and canonical projections
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          mkdir -p dist/live-agent-candidate
          gem build hive.gemspec
          gem_file="$(find . -maxdepth 1 -type f -name 'hive-cli-*.gem' -print -quit)"
          [[ -n "$gem_file" && -s "$gem_file" ]]
          source_archive="$RUNNER_TEMP/hive-source-${CANDIDATE_SHA}.tar.gz"
          git archive --format=tar.gz --output="$source_archive" "$CANDIDATE_SHA"
          ruby packaging/live_agent_skills/build.rb \
            "$CANDIDATE_SHA" "$gem_file" "$source_archive" dist/live-agent-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-agent-candidate-artifacts-${{ github.run_attempt }}
          path: dist/live-agent-candidate
          if-no-files-found: error
          retention-days: 7

  live-agent:
    name: ${{ matrix.display }} live Hive operating skill
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 25
    environment: live-agent-skills-${{ matrix.platform }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: openclaw
            display: OpenClaw
            npm_package: openclaw
          - platform: claude
            display: Claude
            npm_package: "@anthropic-ai/claude-code"
          - platform: codex
            display: Codex
            npm_package: "@openai/codex"
          - platform: pi
            display: Pi
            npm_package: "@mariozechner/pi-coding-agent"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-agent-candidate-artifacts-${{ github.run_attempt }}
          path: candidate-artifacts
      - name: Extract the exact candidate source
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate-source
          tar -xzf "candidate-artifacts/hive-source-${CANDIDATE_SHA}.tar.gz" -C candidate-source
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the native agent CLI in the ephemeral runner
        env:
          NPM_PACKAGE: ${{ matrix.npm_package }}
        run: npm install --global "$NPM_PACKAGE"
      - name: Install the exact candidate gem and test dependencies
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gem_file="$(find candidate-artifacts -maxdepth 1 -type f -name 'hive-cli-*.gem' -print -quit)"
          [[ -n "$gem_file" && -s "$gem_file" ]]
          bash candidate-source/packaging/live_agent_skills/install_candidate_gem.sh \
            "$gem_file" "$RUNNER_TEMP/proven-gems"
          "$RUNNER_TEMP/proven-gems/bin/hive" --version
          cd candidate-source
          bundle install --jobs 4 --retry 2
      - name: Run authenticated structural proof
        env:
          ANTHROPIC_API_KEY: ${{ (matrix.platform == 'claude' || matrix.platform == 'pi') && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_API_KEY: ${{ matrix.platform == 'codex' && secrets.CODEX_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.platform == 'openclaw' && secrets.OPENAI_API_KEY || '' }}
          HIVE_LIVE_MODEL: ${{ vars.HIVE_LIVE_MODEL }}
          HIVE_LIVE_AGENT_SKILLS: "1"
          HIVE_LIVE_AGENT: ${{ matrix.platform }}
          HIVE_RELEASE_GATE: "1"
          HIVE_CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          HIVE_PROOF_ARTIFACTS: ${{ github.workspace }}/candidate-artifacts
          HIVE_PROVEN_HIVE_BIN: ${{ runner.temp }}/proven-gems/bin/hive
          HIVE_EVIDENCE_PATH: ${{ runner.temp }}/live-agent-evidence/${{ matrix.platform }}.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-agent-evidence"
          cd candidate-source
          bundle exec ruby -Itest test/smoke/live_hive_operating_skill_smoke_test.rb
      - name: Upload redacted structural evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-agent-evidence-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-agent-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

  live-workflow-creator:
    name: OpenClaw live workflow-creator skill
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 25
    environment: live-agent-skills-openclaw
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: live-agent-candidate-artifacts-${{ github.run_attempt }}
          path: candidate-artifacts
      - name: Extract the exact candidate source
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate-source
          tar -xzf "candidate-artifacts/hive-source-${CANDIDATE_SHA}.tar.gz" -C candidate-source
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install OpenClaw in the ephemeral runner
        run: npm install --global openclaw
      - name: Install the exact candidate gem and test dependencies
        run: |
          set -euo pipefail
          gem_file="$(find candidate-artifacts -maxdepth 1 -type f -name 'hive-cli-*.gem' -print -quit)"
          [[ -n "$gem_file" && -s "$gem_file" ]]
          bash candidate-source/packaging/live_agent_skills/install_candidate_gem.sh \
            "$gem_file" "$RUNNER_TEMP/proven-gems"
          "$RUNNER_TEMP/proven-gems/bin/hive" --version
          cd candidate-source
          bundle install --jobs 4 --retry 2
      - name: Run authenticated workflow-creator proof
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIVE_LIVE_MODEL: ${{ vars.HIVE_LIVE_MODEL }}
          HIVE_LIVE_AGENT_SKILLS: "1"
          HIVE_RELEASE_GATE: "1"
          HIVE_CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          HIVE_PROOF_ARTIFACTS: ${{ github.workspace }}/candidate-artifacts
          HIVE_CREATOR_EVIDENCE_PATH: ${{ runner.temp }}/workflow-creator-evidence/openclaw-workflow-creator.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-creator-evidence"
          cd candidate-source
          bundle exec ruby -Itest test/smoke/live_hive_workflow_creator_smoke_test.rb
      - name: Upload redacted workflow-creator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workflow-creator-evidence-openclaw-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-creator-evidence/openclaw-workflow-creator.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest exact-SHA live agent proof
    runs-on: ubuntu-24.04
    needs: [validate, build, live-agent, live-workflow-creator]
    permissions:
      actions: read
      checks: write
      contents: read
    outputs:
      attestation_sha256: ${{ steps.attest.outputs.attestation_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-agent-candidate-artifacts-${{ github.run_attempt }}
          path: candidate-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: live-agent-evidence-*-${{ github.run_attempt }}
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: workflow-creator-evidence-*-${{ github.run_attempt }}
          path: creator-evidence
          merge-multiple: true
      - name: Extract candidate verifier
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate-source
          tar -xzf "candidate-artifacts/hive-source-${CANDIDATE_SHA}.tar.gz" -C candidate-source
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Validate operating and workflow-creator proofs
        id: attest
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          WORKFLOW_REVISION: ${{ needs.validate.outputs.workflow_revision }}
        run: |
          set -euo pipefail
          result="$(ruby candidate-source/packaging/live_agent_skills/attest.rb \
            "$CANDIDATE_SHA" "$WORKFLOW_REVISION" "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            candidate-artifacts evidence creator-evidence proof)"
          attestation_sha256="$(jq -er '.attestation_sha256' <<<"$result")"
          echo "attestation_sha256=$attestation_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-agent-skills-proof-${{ github.run_attempt }}
          path: proof
          if-no-files-found: error
          retention-days: 7
      - name: Create trusted candidate Check Run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          WORKFLOW_REVISION: ${{ needs.validate.outputs.workflow_revision }}
          ATTESTATION_SHA256: ${{ steps.attest.outputs.attestation_sha256 }}
        with:
          script: |
            const detailsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const externalId = `live-agent-skills:v1:${context.runId}:${runAttempt}:${process.env.ATTESTATION_SHA256}`;
            const summary = {
              schema: "hive-live-agent-skills-check",
              schema_version: 1,
              candidate_sha: process.env.CANDIDATE_SHA,
              workflow_revision: process.env.WORKFLOW_REVISION,
              run_id: context.runId,
              run_attempt: runAttempt,
              attestation_sha256: process.env.ATTESTATION_SHA256,
              platforms: ["openclaw", "claude", "codex", "pi"],
              workflow_creator: "openclaw"
            };
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "live-agent-skills",
              head_sha: process.env.CANDIDATE_SHA,
              status: "completed",
              conclusion: "success",
              completed_at: new Date().toISOString(),
              external_id: externalId,
              details_url: detailsUrl,
              output: {
                title: "Hive operating and workflow-creator proofs passed",
                summary: `\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\``
              }
            });
