name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default-narrow permissions: candidate/install gates only read trusted state. The
# publish job needs `contents: write` to create the GitHub Release and
# `id-token: write` for cosign keyless signing of SHA256SUMS.
permissions: {}

jobs:
  select-candidate:
    name: Select and verify trusted pre-tag candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out the exact tag target without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
      - name: Resolve tag target and select exact trusted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-selection"
          mkdir -p "$root"
          candidate_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$candidate_sha" = "$GITHUB_SHA"
          version="${REF_NAME#v}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$candidate_sha" refs/remotes/origin/main || {
            echo "tag target is not reachable from protected main" >&2
            exit 1
          }
          if test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .protected)" != true; then
            echo "repository main branch is not protected" >&2
            exit 1
          fi
          source_version="$(ruby -Ilib -e 'require "hive"; print Hive::VERSION')"
          if test "$source_version" != "$version"; then
            echo "tag version $version does not match source version $source_version" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_sha}/check-runs?per_page=100" \
            > "$root/checks.json"
          ruby packaging/release_candidate/select_release_candidate.rb check \
            "$candidate_sha" "$GITHUB_REPOSITORY" "$version" "$root/checks.json" \
            > "$root/check.json"
          evidence_run_id="$(jq -er .evidence_run_id "$root/check.json")"
          evidence_run_attempt="$(jq -er .evidence_run_attempt "$root/check.json")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}" \
            > "$root/evidence-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}/attempts/${evidence_run_attempt}/jobs?per_page=100" \
            > "$root/evidence-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}/artifacts?per_page=100" \
            > "$root/evidence-artifacts.json"
          ruby packaging/release_candidate/select_release_candidate.rb select \
            "$candidate_sha" "$GITHUB_REPOSITORY" "$version" \
            "$root/checks.json" "$root/evidence-run.json" \
            "$root/evidence-jobs.json" "$root/evidence-artifacts.json" \
            > "$root/selection.json"

          evidence_artifact_id="$(jq -er .evidence_artifact_id "$root/selection.json")"
          evidence_artifact_digest="$(jq -er .evidence_artifact_digest "$root/selection.json")"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${evidence_artifact_id}/zip" \
            > "$root/evidence.zip"
          ruby packaging/release_candidate/select_release_candidate.rb digest \
            "$evidence_artifact_digest" "$root/evidence.zip"
          ruby packaging/release_candidate/select_release_candidate.rb extract \
            "$root/evidence.zip" "$root/evidence"
          evidence="$root/evidence/evidence.json"
          test -f "$evidence"
          test "$(sha256sum "$evidence" | awk '{print $1}')" = \
            "$(jq -er .evidence_sha256 "$root/selection.json")"

          producer_run_id="$(jq -er .artifact.producer_run_id "$evidence")"
          candidate_artifact_id="$(jq -er .artifact.id "$evidence")"
          ordinary_run_id="$(jq -er .ordinary_ci.run_id "$evidence")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}" \
            > "$root/producer-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_artifact_id}" \
            > "$root/candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ordinary_run_id}" \
            > "$root/ordinary-run.json"

          workflow_sha="$(jq -er .workflow_revision "$root/selection.json")"
          git merge-base --is-ancestor "$workflow_sha" refs/remotes/origin/main || {
            echo "candidate workflow revision is no longer reachable from protected main" >&2
            exit 1
          }
          for workflow in release-candidate release; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/${workflow}.yml?ref=${workflow_sha}" \
              --jq .content | base64 --decode > "$root/${workflow}.yml"
          done
          action_lock="$(
            ruby packaging/release_candidate/select_release_candidate.rb action-lock \
              .github/workflows/release-candidate.yml "$root/release-candidate.yml" \
              .github/workflows/release.yml "$root/release.yml" |
              jq -er .sha256
          )"
          ruby packaging/release_candidate/select_release_candidate.rb verify \
            "$candidate_sha" "$GITHUB_REPOSITORY" "$version" \
            "$root/checks.json" "$root/evidence-run.json" \
            "$root/evidence-jobs.json" "$root/evidence-artifacts.json" \
            "$root/selection.json" "$evidence" "$root/producer-run.json" \
            "$root/candidate-artifact.json" "$root/ordinary-run.json" \
            "$action_lock" > "$root/verified-selection.json"

          candidate_artifact_digest="$(jq -er .candidate_artifact_digest "$root/verified-selection.json")"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_artifact_id}/zip" \
            > "$root/candidate.zip"
          ruby packaging/release_candidate/select_release_candidate.rb digest \
            "$candidate_artifact_digest" "$root/candidate.zip"
          ruby packaging/release_candidate/select_release_candidate.rb extract \
            "$root/candidate.zip" "$root/candidate"
          ruby packaging/release_candidate/select_release_candidate.rb candidate \
            "$GITHUB_WORKSPACE" "$root/candidate" "$candidate_sha" "$version" \
            > "$root/candidate-manifest.json"

          gem_file="$(jq -er .public_files.gem "$root/candidate-manifest.json")"
          web_file="$(jq -er .public_files.web "$root/candidate-manifest.json")"
          gem_path="$root/candidate/$gem_file"
          web_path="$root/candidate/$web_file"
          install_root="$RUNNER_TEMP/selected-gems"
          packaging/live_agent_skills/install_candidate_gem.sh "$gem_path" "$install_root"
          test "$("$install_root/bin/hive" --version)" = "$version"
          web_sha="$(jq -er --arg file "$web_file" '.files[$file].sha256' "$root/candidate-manifest.json")"
          packaging/verify-managed-web-setup.sh \
            --hive-bin="$install_root/bin/hive" \
            --archive="$web_path" \
            --sha256="$web_sha" \
            --prefix="$RUNNER_TEMP/selected-managed-web"

          mkdir -p "$root/selected/dist" "$root/selected/proof"
          while IFS= read -r file; do
            cp "$root/candidate/$file" "$root/selected/dist/$file"
          done < <(jq -er '.public_files | [.gem, .skills, .web] | .[]' "$root/candidate-manifest.json")
          cp "$root/candidate/manifest.json" "$root/selected/proof/manifest.json"
          cp "$root/verified-selection.json" "$root/selected/proof/selection.json"
          cp "$evidence" "$root/selected/proof/evidence.json"
      - name: Retain only verified exact publication bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-selected-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-selection/selected
          if-no-files-found: error
          retention-days: 1

  install-gate:
    name: gem-install gate / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: select-candidate
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-15, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hive-selected-candidate-${{ github.run_id }}
          path: selected
      - name: Reverify exact selected publication bytes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ruby packaging/release_candidate/select_release_candidate.rb publication \
            selected "$GITHUB_SHA" "${REF_NAME#v}"
      - name: gem install the proven gem
        # Native-runner expansion of the pre-release candidate smoke:
        # confirm the gem installs + runs on macOS arm64 and Linux arm64
        # before publishing. x86_64 is already covered by the offline candidate gate. The
        # gem is arch=any Ruby, so no Arch/emulated cell here — a flaky
        # emulated cell must never block a release (real Arch install is
        # covered post-release by install-verify.yml).
        run: |
          gem_file="$(find selected/dist -maxdepth 1 -type f -name 'hive-cli-*.gem' -print)"
          test "$(printf '%s\n' "$gem_file" | sed '/^$/d' | wc -l)" = 1
          [[ -s "$gem_file" ]] || { echo "no hive-cli-*.gem artifact" >&2; exit 1; }
          sandbox="$(mktemp -d)/gem-sandbox"
          mkdir -p "$sandbox"
          GEM_HOME="$sandbox" GEM_PATH="$sandbox" gem install "$gem_file" \
            --install-dir "$sandbox" \
            --bindir "$sandbox/bin" \
            --no-document \
            --source https://rubygems.org
          GEM_HOME="$sandbox" GEM_PATH="$sandbox" "$sandbox/bin/hive" --version

  release-finalize:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [select-candidate, install-gate]
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      # Job-level so the announce step's `if:` can read it — a step-level
      # env is not yet in scope for that step's own condition (same reason
      # HOMEBREW_TAP_TOKEN lives here). Optional: absent secret => skip.
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    # `aur_enabled` lets the separate `aur-publish` job gate on the
    # presence of the AUR secret. A job-level `if:` CANNOT read
    # `secrets.*` (and job-scoped `env` is not yet in scope there), so we
    # compute the eligibility here — where the secret IS readable as
    # env — and expose it as a job output for `needs.…outputs` to consume.
    outputs:
      aur_enabled: ${{ steps.aur_gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hive-selected-candidate-${{ github.run_id }}
          path: selected
      - name: Reverify exact selected publication bytes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ruby packaging/release_candidate/select_release_candidate.rb publication \
            selected "$GITHUB_SHA" "${REF_NAME#v}"
      - name: Build checksums
        run: |
          cd selected/dist
          sha256sum hive-cli-*.gem hive-agent-skills-*.tar.gz hive-web-*.tar.gz > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
      - name: Sign checksums
        # `--output-certificate` writes the fulcio cert blob that
        # `cosign verify-blob --certificate ... --signature ...` needs
        # at consumption time (install.sh + the agent prompt both
        # follow that path).
        run: |
          cosign sign-blob --yes \
            --output-signature selected/dist/SHA256SUMS.sig \
            --output-certificate selected/dist/SHA256SUMS.pem \
            selected/dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Release notes = the matching `## X.Y.Z` CHANGELOG section, so the
          # GitHub Release shows the real changelog (not a bare "Hive vX.Y.Z").
          # Fall back to the version line if no matching section exists.
          version="${REF_NAME#v}"
          notes_file="$(mktemp)"
          # Capture the matching `## X.Y.Z` section, keeping internal blank
          # lines (so grouped `### ...` subsections render) and trimming only
          # the leading/trailing blanks.
          awk -v ver="$version" '
            $0 == "## " ver { found = 1; next }
            /^## / { found = 0 }
            found { lines[n++] = $0 }
            END {
              s = 0; e = n - 1
              while (s <= e && lines[s] ~ /^[[:space:]]*$/) s++
              while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'Hive %s\n' "$REF_NAME" > "$notes_file"
          fi
          gh release create "$REF_NAME" selected/dist/* \
            --title "$REF_NAME" \
            --notes-file "$notes_file" \
            --verify-tag
      - name: Announce release on Discord
        if: ${{ env.DISCORD_RELEASE_WEBHOOK != '' }}
        # Non-fatal: a Discord webhook hiccup must never abort the release or
        # block the downstream brew/AUR jobs. The webhook URL stays a secret —
        # only the message body (built with jq, fed to curl via stdin) is
        # constructed here, and nothing echoes the URL.
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          content="🚀 **Hive ${REF_NAME}** is out — update with \`hive update\`"$'\n'"Release notes: https://github.com/${REPO}/releases/tag/${REF_NAME}"
          jq -nc --arg c "$content" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -sSf -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_RELEASE_WEBHOOK" >/dev/null
          echo "discord: announced ${REF_NAME}"
      - name: Announce release on Discord (audit when skipped)
        if: ${{ env.DISCORD_RELEASE_WEBHOOK == '' }}
        run: |
          echo "discord: skipped; DISCORD_RELEASE_WEBHOOK is not set"
      - name: Notify Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        # Non-fatal: a tap dispatch hiccup must not abort the release or
        # block the downstream aur-publish job (which `needs` this job).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          gem_sha="$(awk '/hive-cli-/ {print $1}' selected/dist/SHA256SUMS)"
          # Send the WHOLE request body via jq + --input so client_payload
          # is a real JSON object. (`--raw-field client_payload=<json>`
          # sends it as a string, which the dispatch API rejects with
          # HTTP 422 "is not an object".) Building it with jq also keeps
          # version/sha from breaking out of the JSON.
          echo "notify-homebrew: dispatching event_type=hive-release version=${version}"
          jq -nc --arg version "$version" --arg sha "$gem_sha" \
            '{event_type: "hive-release", client_payload: {version: $version, sha256_gem: $sha}}' \
            | gh api repos/ivankuznetsov/homebrew-hive/dispatches --method POST --input -
      - name: Notify Homebrew tap (audit when skipped)
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: |
          echo "notify-homebrew: skipped; HOMEBREW_TAP_TOKEN is not set"
      - name: Determine AUR publish eligibility
        id: aur_gate
        # Only tests the secret for emptiness — never echoes it. The
        # real AUR publish runs in the separate `aur-publish` job
        # (needs an Arch container for makepkg); this just signals it.
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "aur-publish: enabled (AUR_SSH_PRIVATE_KEY is set)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "aur-publish: skipped; AUR_SSH_PRIVATE_KEY is not set"
          fi

  # Build each native hivebox architecture to an untagged registry digest and
  # smoke that exact digest before any public version/latest tag can exist.
  # The promotion job below creates one multi-arch manifest from only the two
  # already-proven digests.
  hivebox-image-amd64:
    name: hivebox image smoke (amd64)
    runs-on: ubuntu-24.04
    needs: release-finalize
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        id: build
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hivebox,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hivebox-amd64
          cache-to: type=gha,mode=max,scope=hivebox-amd64
      - name: Smoke the exact amd64 digest
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: packaging/docker/smoke.sh "ghcr.io/${OWNER}/hivebox@${DIGEST}"

  hivebox-image-arm64:
    name: hivebox image smoke (arm64, native docker)
    runs-on: ubuntu-24.04-arm
    needs: release-finalize
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        id: build
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hivebox,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hivebox-arm64
          cache-to: type=gha,mode=max,scope=hivebox-arm64
      - name: Smoke the exact arm64 digest
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: packaging/docker/smoke.sh "ghcr.io/${OWNER}/hivebox@${DIGEST}"

  hivebox-image:
    name: hivebox image (ghcr)
    runs-on: ubuntu-24.04
    needs: [hivebox-image-amd64, hivebox-image-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the two proven digests
        env:
          OWNER: ${{ github.repository_owner }}
          AMD64_DIGEST: ${{ needs.hivebox-image-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.hivebox-image-arm64.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${OWNER}/hivebox"
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            "${image}@${AMD64_DIGEST}" \
            "${image}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${image}:${version}"

  aur-publish:
    name: Publish AUR hive-bin
    runs-on: ubuntu-24.04
    needs: release-finalize
    # Gate on the output computed in release-finalize — a job-level `if:`
    # can read `needs.<job>.outputs.*` but NOT `secrets.*`. When the
    # secret is absent the job is skipped entirely (the Arch container
    # never even boots).
    if: ${{ needs.release-finalize.outputs.aur_enabled == 'true' }}
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Install toolchain
        # base-devel (makepkg, fakeroot, sudo) ships in the image; add
        # the rest. git is needed before actions/checkout can run.
        # ruby-erb: Arch splits the erb stdlib into its own package, and
        # packaging/render.rb does `require "erb"` — without it the render
        # step dies with `cannot load such file -- erb (LoadError)`.
        run: pacman -Syu --noconfirm --needed git openssh cosign ruby ruby-erb jq github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and cosign-verify release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$REF_NAME" --repo ivankuznetsov/hive \
            --pattern 'hive-cli-*.gem' \
            --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.sig' \
            --pattern 'SHA256SUMS.pem' \
            --dir dist
          # Pin the keyless identity to OUR release workflow. An unpinned
          # verify accepts ANY Fulcio-issued cert from ANY repo, which is
          # not a real gate. Mirrors install.sh's verification.
          cosign verify-blob \
            --certificate dist/SHA256SUMS.pem \
            --signature dist/SHA256SUMS.sig \
            --certificate-identity-regexp "^https://github\.com/ivankuznetsov/hive/\.github/workflows/release\.yml@refs/tags/${REF_NAME}$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/SHA256SUMS
          version="${REF_NAME#v}"
          gem_file="hive-cli-${version}.gem"
          # Confirm the gem's digest is the one cosign just vouched for.
          ( cd dist && grep -F "  ${gem_file}" SHA256SUMS | sha256sum -c - )
          gem_sha="$(awk -v f="$gem_file" '$2 == f {print $1}' dist/SHA256SUMS)"
          [[ -n "$gem_sha" ]] || { echo "no checksum for ${gem_file} in SHA256SUMS" >&2; exit 1; }
          {
            echo "GEM_SHA=$gem_sha"
            echo "PKG_VERSION=$version"
          } >> "$GITHUB_ENV"
      - name: Render PKGBUILD and generate .SRCINFO
        # makepkg refuses to run as root, even for --printsrcinfo, so the
        # generation runs as a non-root build user.
        run: |
          useradd -m builder
          mkdir -p build
          ruby packaging/render.rb packaging/aur/PKGBUILD.template \
            "version=${PKG_VERSION}" "sha256_gem=${GEM_SHA}" > build/PKGBUILD
          cp packaging/aur/hive.install build/hive.install
          chown -R builder build
          # Redirect runs inside the builder shell so .SRCINFO is written
          # as builder (sudo does not apply to a root-shell redirect).
          ( cd build && sudo -u builder bash -c 'makepkg --printsrcinfo > .SRCINFO' )
      - name: Push to AUR
        run: |
          install -dm700 ~/.ssh
          # Accept AUR's host key on first connect (TOFU) and record it.
          # ssh-keyscan was unreliable in the container (clone failed with
          # "Host key verification failed"); accept-new keeps host identity
          # checking enabled while allowing non-interactive first contact.
          # The AUR SSH key remains the separate write-authorization gate.
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          # Load the key straight from env into the agent via stdin — the
          # private key is never written to disk (so a compromised gem dep
          # fetched elsewhere in the pipeline cannot read it off disk).
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | ssh-add - >/dev/null
          git config --global user.name "hive release bot"
          git config --global user.email "maintainers@users.noreply.github.com"
          git clone ssh://aur@aur.archlinux.org/hive-bin.git aur-repo
          cp build/PKGBUILD build/.SRCINFO build/hive.install aur-repo/
          cd aur-repo
          git add -A
          # Idempotent: a re-run of an already-published tag is a clean
          # no-op instead of a `set -e` failure on "nothing to commit".
          if git diff --cached --quiet; then
            echo "aur-publish: hive-bin already at ${PKG_VERSION}; nothing to push"
          else
            git commit -m "hive-bin ${PKG_VERSION}"
            git push
          fi

  # Post-release: now that the gem is released and the brew/AUR packages
  # are published, do the REAL channel installs (brew install / yay -S /
  # install.sh) of this version. Runs whenever release-finalize succeeded,
  # regardless of whether aur-publish ran (it self-skips without the secret).
  post-release-verify:
    needs: [release-finalize, aur-publish]
    if: ${{ always() && needs.release-finalize.result == 'success' }}
    uses: ./.github/workflows/install-verify.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      issues: write
