      - lib/hive/stages/patrol_fix/validate.rb
      - lib/hive/stages/patrol_fix/review.rb
      - lib/hive/stages/patrol_fix/publish.rb
    mutation_authority: "Strict task-local manifest replacement, append-only decision/fix/validation/publication/reopen receipts, stable receipt-gated stage/route-transition journals, and reciprocal coding-successor relations only."
    recovery_surface: "Replays incomplete rework route actions and reconciles exactly one linked coding successor; no scheduler, adapter, issue, or remote-publication authority."
