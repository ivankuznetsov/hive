name: incident_provider_limit_retry
description: Proves a trusted provider-account failure opens one circuit and the existing recovery owner retries once on the next configured route.
tags: [incident-regression]
coverage:
  primary: recovery.provider_limit
  supporting: []
incident_id: provider-limit-retry
sibling_task_id: "#9770"
pending: false

steps:
  - kind: seed_state
    stage: 3-plan
    slug: provider-route-fallback
    state_file: plan.md
    content: "# Plan\n\nImplement provider fallback.\n\n<!-- COMPLETE -->\n"
    files:
      - path: meta.yml
        content: |
          id: 9770
          slug: provider-route-fallback
          display_name: Provider route fallback

  - kind: ruby_block
    description: Seed the implementation-ready boundary, opt it into an ordered Codex-to-Claude pool, and shorten the daemon poll for the hermetic incident.
    block: |
      global_path = File.join(run_home, "config.yml")
      global = YAML.safe_load(File.read(global_path)) || {}
      global["providers"] = {
        "claude-a" => {
          "adapter" => "claude",
          "launch_binding" => "default",
          "models" => ["claude-e2e-model"],
          "max_concurrent" => 1,
          "cooldown_sec" => { "account_quota" => 3_600 }
        },
        "codex-b" => {
          "adapter" => "codex",
          "launch_binding" => "default",
          "models" => ["codex-e2e-model"],
          "max_concurrent" => 1
        }
      }
      global["daemon"] = (global["daemon"] || {}).merge(
        "poll_interval_sec" => 5,
        "fast_poll_sec" => 1,
        "edit_debounce_sec" => 0,
        "shutdown_grace_sec" => 0
      )
      File.write(global_path, global.to_yaml)

      project_path = File.join(sandbox, ".hive-state", "config.yml")
      project = YAML.safe_load(File.read(project_path)) || {}
      project["daemon"] = (project["daemon"] || {}).merge("enabled" => true)
      project["patrol"] = (project["patrol"] || {}).merge(
        "mode" => "off",
        "enabled" => false
      )
      project["refactor_patrol"] = (project["refactor_patrol"] || {}).merge(
        "enabled" => false
      )
      project.fetch("execute")["routing"] = {
        "pool" => [
          {
            "provider" => "claude-a",
            "model" => "claude-e2e-model",
            "effort" => "high"
          },
          {
            "provider" => "codex-b",
            "model" => "codex-e2e-model",
            "effort" => "high"
          }
        ]
      }
      File.write(project_path, project.to_yaml)

  - kind: cli
    description: The first ordinary attempt selects A and terminates from a trusted account-quota transport event.
    args: [develop, "{slug}", --from, 3-plan]
    expect_exit: null
    env:
      HIVE_FAKE_CLAUDE_OUTPUT: '{"type":"rate_limit_event","rate_limit_info":{"status":"rejected","rateLimitType":"five_hour"}}'
      HIVE_FAKE_CLAUDE_COMMIT_FILE: provider-routing.txt
      HIVE_FAKE_CLAUDE_COMMIT_CONTENT: "implemented through the routed attempt\n"
      HIVE_FAKE_CLAUDE_COMMIT_MESSAGE: "test: implement provider route fixture"

  - kind: state_assert
    description: The admitted route failure is visible before recovery begins.
    path: "{task_dir:4-execute}/task.md"
    contains: "reason=provider_route_failed"
    timeout: 5

  - kind: ruby_block
    description: The immutable trusted receipt is durable, no retry exists before daemon ownership, and the fixture advances only the persisted cooldown clock.
    block: |
      require "hive/agent_limit"
      require "hive/attempts/store"
      require "hive/daemon/dispatch_request_queue"

      attempts = Hive::Attempts::Store.open_default(state_home: run_home)
      first = attempts.scan.records.select { |record| record["intended_stage"] == "4-execute" }
      raise "expected exactly one initial execute attempt, got #{first.size}" unless first.size == 1
      first = first.fetch(0)
      route = first["routing"].fetch("route")
      evidence = first.receipt.fetch("provider_evidence")
      raise "preferred route was not selected" unless route.fetch("route_id") == "claude-a/claude-e2e-model"
      raise "initial route was not terminal failed" unless first.state == "terminal" && first.outcome == "failed"
      raise "initial attempt consumed a retry charge" unless first["retry_charge"] == 0
      raise "unsafe or wrong evidence was persisted" unless evidence.fetch("failure_class") == "account_quota" && evidence.dig("scope", "kind") == "provider_account"
      raise "recovery request existed before daemon ownership" unless Hive::Daemon::DispatchRequestQueue.pending(state_home: run_home).empty?

      state_file = File.join(sandbox, ".hive-state", "stages", "4-execute", slug, "task.md")
      eligible_at = Time.now - Hive::AgentLimit.retry_cooldown_sec - 1
      File.utime(eligible_at, eligible_at, state_file)

  - kind: spawn_background
    id: daemon
    args: [daemon, start]
    env:
      HIVE_DAEMON_NO_AUTO_REEXEC: "1"
      HIVE_LIMITS_RETRY_COOLDOWN_SEC: "1"
      HIVE_FAKE_CLAUDE_OUTPUT: '{"type":"rate_limit_event","rate_limit_info":{"status":"rejected","rateLimitType":"five_hour"}}'
      HIVE_FAKE_CLAUDE_COMMIT_FILE: provider-routing.txt
      HIVE_FAKE_CLAUDE_COMMIT_CONTENT: "implemented through the routed attempt\n"
      HIVE_FAKE_CLAUDE_COMMIT_MESSAGE: "test: implement provider route fixture"

  - kind: state_assert
    description: RecoveryCoordinator clears and redispatches once; the successor excludes A, selects B, and completes normally.
    path: "{task_dir:4-execute}/task.md"
    marker: { current: EXECUTE_COMPLETE }
    timeout: 9

  - kind: ruby_block
    description: Keep the daemon alive until it reaps the successful successor and seals the one recovery receipt.
    block: |
      require "hive/daemon/dispatch_request_queue"
      deadline = Time.now + 3
      loop do
        directory = Hive::Daemon::DispatchRequestQueue.directory(state_home: run_home)
        terminal = Dir.glob(File.join(directory, "*.json*")).any? do |path|
          payload = JSON.parse(File.binread(path))
          payload["schema"] == "hive-dispatch-request" &&
            payload.dig("recovery", "phase") == "terminal"
        rescue JSON::ParserError, Errno::ENOENT
          false
        end
        break if terminal
        raise "daemon did not seal the recovery receipt" if Time.now >= deadline
        sleep 0.05
      end

  - kind: stop_process
    id: daemon

  - kind: ruby_block
    description: Prove exact attempt, circuit, request, charge, exclusion, and ownership counts after repeated daemon ticks.
    block: |
      require "hive/attempts/record"
      require "hive/attempts/store"
      require "hive/daemon/dispatch_request_queue"
      require "hive/provider_health"

      attempts = Hive::Attempts::Store.open_default(state_home: run_home)
      record_paths = Dir.glob(File.join(attempts.records_root, "*.json")) +
        Dir.glob(File.join(attempts.proof_root, "attempt", "*", "*.json"))
      records = record_paths.filter_map do |path|
        Hive::Attempts::Record.new(JSON.parse(File.binread(path)))
      rescue JSON::ParserError, Hive::Attempts::InvalidRecord
        nil
      end
      execute = records.uniq(&:attempt_id).select do |record|
        record["intended_stage"] == "4-execute"
      end
      raise "expected exactly two execute attempts, got #{execute.size}" unless execute.size == 2

      requests_dir = Hive::Daemon::DispatchRequestQueue.directory(state_home: run_home)
      requests = Dir.glob(File.join(requests_dir, "*.json*")).filter_map do |path|
        payload = JSON.parse(File.binread(path))
        payload if payload["schema"] == "hive-dispatch-request"
      rescue JSON::ParserError, Errno::ENOENT
        nil
      end.uniq { |payload| payload.fetch("request_id") }
      recoveries = requests.select { |payload| payload.dig("recovery", "phase") == "terminal" }
      raise "expected one terminal recovery request, got #{recoveries.size}" unless recoveries.size == 1
      recovery = recoveries.fetch(0).fetch("recovery")

      first_id = recovery.dig("source_receipt", "attempt_id")
      second_id = recovery.fetch("attempt_id")
      first = execute.find { |record| record.attempt_id == first_id }
      second = execute.find { |record| record.attempt_id == second_id }
      raise "recovery receipt did not identify both attempts" unless first && second
      raise "attempt routes were not A then B" unless [first, second].map { |record| record["routing"].dig("route", "route_id") } == ["claude-a/claude-e2e-model", "codex-b/codex-e2e-model"]
      raise "retry charges were not exactly zero then one" unless [first["retry_charge"], second["retry_charge"]] == [0, 1]
      raise "successor lost predecessor ownership" unless second["predecessor_attempt_id"] == first.attempt_id
      raise "successor changed frozen generation policy" unless second.task_generation == first.task_generation && second["routing"].fetch("policy_digest") == first["routing"].fetch("policy_digest")
      raise "attempt outcomes were not failed then succeeded" unless [first.outcome, second.outcome] == %w[failed succeeded]
      exclusions = second["routing"].dig("decision", "exclusions")
      raise "successor did not explain the preferred-route exclusion" unless exclusions == [{"route_id" => "claude-a/claude-e2e-model", "reason" => "circuit_open", "detail" => nil}]

      raise "recovery did not preserve the provider-neutral failure" unless recovery.fetch("failure_origin") == "provider_route_failed"
      raise "recovery was not charged exactly once" unless recovery.fetch("retry_count") == 1
      raise "recovery did not finish successfully" unless recovery.fetch("terminal_outcome") == "succeeded"
      raise "pending recovery remained after terminalization" unless Hive::Daemon::DispatchRequestQueue.pending(state_home: run_home).empty?
      claimed = Hive::Daemon::DispatchRequestQueue.claimed(state_home: run_home)
      raise "terminal recovery receipt was duplicated or lost" unless claimed.size == 1 && claimed.fetch(0).request.request_id == recoveries.fetch(0).fetch("request_id")
      raise "live attempt remained after terminalization" unless execute.none?(&:live?)

      health = Hive::ProviderHealth.open(
        root: File.join(run_home, "provider-health", "v1")
      )
      scopes = {
        "claude-provider" => Hive::ProviderHealth::Scope.provider_account(account_id: "claude-a"),
        "claude-model" => Hive::ProviderHealth::Scope.model(account_id: "claude-a", model_id: "claude-e2e-model"),
        "codex-provider" => Hive::ProviderHealth::Scope.provider_account(account_id: "codex-b"),
        "codex-model" => Hive::ProviderHealth::Scope.model(account_id: "codex-b", model_id: "codex-e2e-model")
      }.transform_values { |scope| health.inspect_scope(scope) }
      claude = scopes.fetch("claude-provider")
      raise "Claude account circuit changed more than once" unless claude.generation == 1 && claude.circuit.automatic_state == "open"
      scopes.except("claude-provider").each do |name, inspection|
        raise "#{name} circuit changed unexpectedly" unless inspection.generation == 0 && inspection.circuit.automatic_state == "closed"
      end
