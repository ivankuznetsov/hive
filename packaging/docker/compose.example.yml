services:
  hivebox:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "4567:4567"
    volumes:
      - ./hivebox-data:/data
    environment:
      # GitHub sign-in uses the OAuth *device flow*: no client secret and no
      # callback URL exist. Configure `web.github.owner` in the bind-mounted
      # config.yml; the default client_id is the shared hivebox OAuth app.
      HIVEBOX_SESSION_SECRET: "${HIVEBOX_SESSION_SECRET:-}"
