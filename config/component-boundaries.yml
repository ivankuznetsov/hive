        - Hive::ProviderHealth::AttemptObserver
        - Hive::ProviderHealth::AttemptBinding
        - Hive::ProviderHealth::Circuit
        - Hive::ProviderHealth::Evidence
        - Hive::ProviderHealth::Inspection
        - Hive::ProviderHealth::ProbeBinding
        - Hive::ProviderHealth::ProbeRequirement
        - Hive::ProviderHealth::Repository
        - Hive::ProviderHealth::RouteEvaluation
        - Hive::ProviderHealth::RouteIdentity
      errors:
        - Hive::ProviderHealth::Error
        - Hive::ProviderHealth::InvalidScope
        - Hive::ProviderHealth::InvalidEvidence
        - Hive::ProviderHealth::InvalidMutation
        - Hive::ProviderHealth::StaleGeneration
        - Hive::ProviderHealth::Unavailable
    owned_paths:
      - lib/hive/provider_health.rb
      - lib/hive/provider_health/audit.rb
      - lib/hive/provider_health/attempt_observer.rb
      - lib/hive/provider_health/circuit.rb
      - lib/hive/provider_health/evidence.rb
      - lib/hive/provider_health/event.rb
      - lib/hive/provider_health/repository.rb
      - schemas/hive-provider-health.v1.json
      - schemas/hive-provider-health-event.v1.json
    state_contracts:
      - "Provider-account and exact-model circuits are constrained runtime-control-plane rows composed only at read time"
      - "Evidence, probe, and operator mutations use generation CAS in short immediate transactions"
      - "Probe ownership binds directly to durable attempt identity and ownership fences; no timer, lease, retry, successor, or dispatch owner exists here"
      - "Malformed or corrupt SQL rows fail closed without a filesystem fallback"
    schema_contracts:
      - "Projection and event schemas are recursively closed against raw prompts, messages, stdout, stderr, tool output, tokens, and credentials"
      - "Evidence fingerprints derive only from canonical allowlisted class, scope, provenance, route ID, and bounded reset hint"
      - "Audit rows are bounded and idempotent per circuit without retaining raw provider output"
    lock_contracts:
      - "AdmissionTransition is the only cross-domain transaction that binds provider probes to a launching attempt"
      - "Repository transactions acquire no filesystem, provider, process, or task-generation lock"
    component_dependencies:
      - runtime-control-plane
    allowed_hive_dependencies:
      - hive
      - hive/canonical_json
      - hive/output_reference
      - hive/runtime_control_plane
      - hive/secret_patterns
    internal_collaborators:
      - Hive::OutputReference
      - Hive::RuntimeControlPlane
    forbidden_constructions: []
    authorized_internal_constructions: []
    hive_consumers:
      - lib/hive.rb
      - lib/hive/paths.rb
      - lib/hive/attempts/dispatcher.rb
      - lib/hive/attempts/evidence_channel.rb
      - lib/hive/attempts/finalization_maintenance.rb
      - lib/hive/commands/circuits.rb
      - lib/hive/provider_routing/operational_projection.rb
    mutation_authority: "Provider circuit and bounded audit rows in the runtime control plane only."
    recovery_surface: "Conservative eligibility and attempt-fenced probe reconciliation only; RecoveryCoordinator remains the sole retry, charge, deadline, successor, and dispatch owner."
    wiki_page: wiki/modules/provider_health.md
    focused_tests:
