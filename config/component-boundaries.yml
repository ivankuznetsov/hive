    state_contracts:
      - "StateStore and JobStore expose the only product recovery APIs over one OccurrenceJournal facade; OccurrenceRecordStore is the sole occurrence-cell lock/read/write owner"
      - "JobStore v3 owns the immutable job-to-occurrence and intake-transition identities; discovery attempts, actions, and diagnostic episodes append exact transition identities"
      - "Canonical occurrence records atomically bind prepared or uncertain delivery, terminal outcomes, and ordered projection outbox bytes; persisted sender leases and PID authority do not exist"
      - "A committed or reconciled ordinary Patrol pull request atomically appends its exact terminal receipt bytes as a typed publication outbox entry; StateStore alone projects that entry to one immutable publication_binding before tuple acknowledgement"
      - "EvidenceStore is an append-only bounded observational projection under module-runtime/migration/patrol-evidence and is never consulted for retry"
      - "ActionRunner and RefactorPatrolScheduler decide product work; composed action/discovery transition coordinators own durable transition identities, claim fences, and replay"
      - "JobStoreFiles is the sole descriptor-confined physical I/O port for live v3 jobs, query indexes, quarantine evidence, and action locks; JobQueryIndex owns only their bounded logical projection"
      - "JobStoreFreshStart atomically archives only released v2/jobs as opaque bytes; runtime never reads or converts it, and an explicit confirmed reset alone admits an empty v3 namespace"
    schema_contracts:
      - "hive-patrol-capture v1 and hive-patrol-effect-receipt v1 are strict canonical observation records"
      - "hive-refactor-patrol-job v3 is the sole runtime JobStore schema; released v2 jobs have no compatibility reader or converter"
      - "hive-patrol-occurrence-recovery-index v1 is a bounded rebuildable active-ID projection tied to the journal-state recovery generation; occurrence records remain authoritative"
    lock_contracts:
      - "Persist intent before shared migration admission; under live owner, epoch, config, module-generation, capability, and claim checks, one process-local keyed mutex plus one stable mode-0600 flock serializes each sender"
      - "Dispatch uncertainty is reconciliation-only; exact absence must settle before a retry-safe local sink may resend, while remote absence never grants resend authority"
      - "Architecture manifest reservation and the JobStore occurrence pointer serialize before the enqueue transition; command and daemon intake share the same coordinator"
      - "Every live JobStore read, write, enumeration, quarantine publication, index publication, and action/job lock resolves through one verified ManagedDirectory anchor"
      - "The stable profile activation lock excludes daemon startup; reset drains the exact daemon generation before taking the existing Patrol effect lock exclusively, then holds that effect lock, the stable generation lock, and the independent PID/start-time writer fence across opaque v2 archive, empty-v3 admission, and receipt publication"
