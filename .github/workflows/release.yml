name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x86_64-gnu
            runner: ubuntu-24.04
          - target: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install Tebako
        run: gem install tebako
      - name: Build release artifact
        run: bundle exec rake "build:release[${{ matrix.target }}]"
      - uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.target }}
          path: tmp/release/hive-*.tar.gz
          if-no-files-found: error

  release-finalize:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hive-*
          path: dist
          merge-multiple: true
      - name: Build checksums
        run: |
          cd dist
          sha256sum hive-*.tar.gz > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Hive ${GITHUB_REF_NAME}" \
            --verify-tag
      - name: Notify Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          darwin_sha="$(awk '/darwin-arm64/ {print $1}' dist/SHA256SUMS)"
          gh api repos/ivankuznetsov/homebrew-hive/dispatches \
            --method POST \
            --field event_type=hive-release \
            --raw-field client_payload="{\"version\":\"${version}\",\"sha256_darwin_arm64\":\"${darwin_sha}\"}"
      - name: Prepare AUR publish payload
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          echo "AUR publish is enabled by secret; packaging/aur templates are the source of truth for the publish job."
