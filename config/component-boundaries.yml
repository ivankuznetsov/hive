      - schemas/hive-patrol-fix-receipt.v1.json
      - schemas/hive-patrol-fix-projection.v1.json
      - schemas/hive-patrol-fix-dogfood-report.v1.json
      - schemas/hive-patrol-fix-attempt-diagnostic.v1.json
    state_contracts:
      - "The strict task manifest binds every source revision and one canonical task generation while append-only receipts bind exact evidence generation"
      - "Equivalent evidence may add provenance within a generation; materially changed evidence advances exactly one generation and invalidates old receipts"
      - "Projection fails closed with bounded diagnostics, keeps parked outcomes non-done, and requires an exact current publication receipt for done"
      - "Standard task status exposes Patrol Fix stages and actions without a second project-level operational projection"
      - "Source-owned handoffs feed one strict admission occurrence; deterministic intent precedes task capture, exact binding precedes source acknowledgement, and replay repairs every incomplete boundary"
      - "Semantic admission snapshots and revalidates the bounded candidate set without holding a durable store lock across provider reasoning"
      - "Local fix generations bind exact evidence, base, owned worktree, branch, clean committed head, and bounded diff without remote authentication or publication"
      - "Validation records only deliberate controller or structured agent-selected commands; reproduction prose is never an executable input"
      - "Independent review binds the current evidence, fix diff, validation receipt, and worktree head before a closed semantic route becomes durable"
      - "Rework advances generation under a stable replayable intent and invalidates prior validation"
      - "Escalation creates exactly one linked coding task through TaskCapture and reciprocal controller-owned relation bytes without a GitHub issue effect"
      - "The Patrol Fix workflow directly owns remediation for newly accepted findings; historical local findings are imported only by the one-time script"
    schema_contracts:
      - "Manifest, decision, receipt, and task projection contracts are versioned, bounded, and reject unknown fields"
      - "Source provenance includes source engine, identity, target revision, evidence, affected code, reproduction guidance, discovery run, and semantic lineage"
      - "Source snapshots and admission records are canonical, size bounded, digest bound, and reject secret-like material"
      - "Dogfood reports bind one source occurrence through ordered workflow observations to one exact publication receipt and zero-duplicate replay counts"
      - "Attempt diagnostics are append-only, receipt-bound, secret-redacted typed records with exact attempt, ownership generation, phase, and private log identity"
    lock_contracts:
      - "Manifest replacement is atomic and receipts append under a task-local journal lock"
      - "Patrol-fix moves also hold a stable slug lock outside the moving task folder and journal intent before move plus committed reconciliation afterward"
      - "Admission records use per-occurrence locks; cross-occurrence task materialization is serialized without holding a source lock"
