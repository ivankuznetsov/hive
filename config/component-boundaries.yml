    state_contracts:
      - "Inspection reads the bounded durable decision projection, attempt-derived account capacity, and scoped health journals without rerunning route selection"
      - "An empty account registry returns not_configured before opening attempt or health storage"
      - "The projection owns no task, attempt, recovery, dispatch, or provider-health mutation"
    schema_contracts:
      - "The projection contains typed routing and health metadata only; raw prompts, messages, stdout, stderr, tool output, tokens, and credentials are excluded"
      - "Decision enumeration is hard-bounded and preserves the durable project, task-generation, subject, and optional admitted-attempt identity"
    lock_contracts:
      - "Inspection performs bounded owner-store reads only and acquires no admission or task-generation lock"
      - "Provider-health inspection remains serialized by the health store and never nests an earlier admission lock"
    component_dependencies:
