name: Install smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash -n install.sh
      - run: bash -n packaging/verify-release.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: '.'
          additional_files: |
            install.sh
            packaging/verify-release.sh
      - run: bash install.sh --dry-run --version=v0.1.0

  macos-dry-run:
    name: macOS dry run
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: bash install.sh --dry-run --version=v0.1.0

  arch-dry-run:
    name: Arch dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest \
            bash -lc 'pacman -Sy --noconfirm bash curl grep sed gawk coreutils jq && bash install.sh --dry-run --version=v0.1.0'

  die-paths:
    name: install.sh die paths (malformed inputs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: rejects bogus HIVE_VERSION
        env:
          HIVE_VERSION: 'v0.1.0/../../evil'
        run: |
          set +e
          bash install.sh --dry-run
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]] || { echo "expected non-zero exit for malformed HIVE_VERSION" >&2; exit 1; }
      - name: rejects bogus HIVE_REPO_OWNER
        env:
          HIVE_REPO_OWNER: 'evil$injection'
        run: |
          set +e
          bash install.sh --dry-run --version=v0.1.0
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]] || { echo "expected non-zero exit for malformed HIVE_REPO_OWNER" >&2; exit 1; }

  full-smoke:
    name: install.sh full install smoke (against real release)
    runs-on: ubuntu-24.04
    # Pinned to a known-good release so a PR can't gate on a release
    # not yet cut. Skipped on PRs that change install.sh syntactically
    # but predate a published release.
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check pinned release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_VERSION: v0.1.0
        run: |
          if gh release view "$HIVE_VERSION" --repo ivankuznetsov/hive >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "full install smoke skipped: ${HIVE_VERSION} is not published yet" >&2
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install + verify
        if: ${{ steps.release.outputs.exists == 'true' }}
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/xdg-data
          XDG_BIN_HOME: ${{ github.workspace }}/xdg-bin
          HIVE_VERSION: v0.1.0
        run: |
          mkdir -p "$XDG_DATA_HOME" "$XDG_BIN_HOME"
          bash install.sh --version="$HIVE_VERSION"
          test -s "$XDG_DATA_HOME/hive/install-channel"
          grep -q '^bash$' "$XDG_DATA_HOME/hive/install-channel"
          test -x "$XDG_BIN_HOME/hive"
          "$XDG_BIN_HOME/hive" --version

  verify-release:
    name: verify-release.sh (end-to-end behavior)
    runs-on: ubuntu-24.04
    # Same gate as full-smoke: only runs against a real published
    # release. Skips on PRs that predate the pinned release. The
    # script feature-detects post-pin subcommands (e.g., `daemon
    # install` shipped post-v0.1.0) and skips their assertions when
    # the released binary doesn't have them yet.
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check pinned release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_VERSION: v0.1.0
        run: |
          if gh release view "$HIVE_VERSION" --repo ivankuznetsov/hive >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify-release skipped: ${HIVE_VERSION} is not published yet" >&2
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure jq is available
        if: ${{ steps.release.outputs.exists == 'true' }}
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
            exit 0
          fi

          if ! sudo apt-get update -qq; then
            echo "apt-get update failed; disabling packages.microsoft.com sources and retrying" >&2
            mapfile -t microsoft_sources < <(
              grep -rl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            )
            for source in "${microsoft_sources[@]}"; do
              echo "disabling $source" >&2
              sudo mv "$source" "$source.disabled"
            done
            sudo apt-get update -qq
          fi

          sudo apt-get install -y -qq jq
          jq --version
      - name: Run verify-release.sh
        if: ${{ steps.release.outputs.exists == 'true' }}
        env:
          HIVE_VERSION: v0.1.0
        run: |
          bash packaging/verify-release.sh --version="$HIVE_VERSION"

  installer-fixtures:
    name: install.sh fixture regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: checksum mismatch fails clearly
        run: |
          set -euo pipefail
          fixtures="$(mktemp -d)"
          fakebin="$(mktemp -d)"
          printf 'not the gem\n' > "$fixtures/hive-cli-0.1.0.gem"
          printf '%064d  hive-cli-0.1.0.gem\n' 0 > "$fixtures/SHA256SUMS"
          : > "$fixtures/SHA256SUMS.sig"
          : > "$fixtures/SHA256SUMS.pem"
          cat > "$fakebin/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out=""
          url=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -w) shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            *SHA256SUMS.sig) cp "$FIXTURES/SHA256SUMS.sig" "$out" ;;
            *SHA256SUMS.pem) cp "$FIXTURES/SHA256SUMS.pem" "$out" ;;
            *SHA256SUMS) cp "$FIXTURES/SHA256SUMS" "$out" ;;
            *.gem) cp "$FIXTURES/hive-cli-0.1.0.gem" "$out" ;;
            *) echo "unexpected url: $url" >&2; exit 22 ;;
          esac
          printf '200'
          SH
          chmod +x "$fakebin/curl"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$fakebin/cosign"
          chmod +x "$fakebin/cosign"
          set +e
          FIXTURES="$fixtures" PATH="$fakebin:$PATH" bash install.sh --version=v0.1.0 >"$fixtures/out" 2>"$fixtures/err"
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]] || { echo "expected checksum mismatch to fail" >&2; exit 1; }
          grep -q "checksum mismatch" "$fixtures/err"
      - name: PATH collision creates hv fallback
        run: |
          set -euo pipefail
          fixtures="$(mktemp -d)"
          fakebin="$(mktemp -d)"
          # Build a minimal hive-cli-0.1.0.gem with stub hive/hv bins so
          # install.sh's `gem install` step has a real, well-formed
          # artifact to consume.
          gemroot="$fixtures/gemroot"
          mkdir -p "$gemroot/bin"
          cat > "$gemroot/bin/hive" <<'SH'
          #!/usr/bin/env ruby
          if ARGV == ["daemon", "install", "--json"]
            File.write(ENV.fetch("HIVE_DAEMON_ENV_CAPTURE"), ENV["HIVE_INVOKED_BIN"].to_s)
            puts '{"schema":"hive-daemon-install","schema_version":1,"ok":true,"outcome":"written","platform":"linux","target_path":"/tmp/hive-daemon.service","backup_path":null,"restarted":false,"messages":[]}'
          else
            puts "0.1.0"
          end
          SH
          cat > "$gemroot/bin/hv" <<'SH'
          #!/usr/bin/env ruby
          puts "0.1.0"
          SH
          chmod +x "$gemroot/bin/hive" "$gemroot/bin/hv"
          cat > "$gemroot/hive-cli.gemspec" <<'RUBY'
          Gem::Specification.new do |s|
            s.name = "hive-cli"
            s.version = "0.1.0"
            s.summary = "fixture stub"
            s.author = "fixture"
            s.bindir = "bin"
            s.executables = ["hive", "hv"]
            s.files = Dir["bin/*"]
          end
          RUBY
          ( cd "$gemroot" && gem build hive-cli.gemspec )
          cp "$gemroot/hive-cli-0.1.0.gem" "$fixtures/"
          sha256sum "$fixtures/hive-cli-0.1.0.gem" | awk '{print $1 "  hive-cli-0.1.0.gem"}' > "$fixtures/SHA256SUMS"
          : > "$fixtures/SHA256SUMS.sig"
          : > "$fixtures/SHA256SUMS.pem"
          cat > "$fakebin/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out=""
          url=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -w) shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            *SHA256SUMS.sig) cp "$FIXTURES/SHA256SUMS.sig" "$out" ;;
            *SHA256SUMS.pem) cp "$FIXTURES/SHA256SUMS.pem" "$out" ;;
            *SHA256SUMS) cp "$FIXTURES/SHA256SUMS" "$out" ;;
            *.gem) cp "$FIXTURES/hive-cli-0.1.0.gem" "$out" ;;
            *) echo "unexpected url: $url" >&2; exit 22 ;;
          esac
          printf '200'
          SH
          chmod +x "$fakebin/curl"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$fakebin/cosign"
          chmod +x "$fakebin/cosign"
          cat > "$fakebin/npm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          prefix=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              --prefix) prefix="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          [[ -n "$prefix" ]] || { echo "missing --prefix" >&2; exit 1; }
          mkdir -p "$prefix/bin"
          cat > "$prefix/bin/qmd" <<'QMD'
          #!/usr/bin/env bash
          echo "qmd fixture"
          QMD
          chmod +x "$prefix/bin/qmd"
          SH
          chmod +x "$fakebin/npm"
          apache_bin="$fixtures/apache-bin"
          xdg_bin="$fixtures/xdg-bin"
          xdg_data="$fixtures/xdg-data"
          mkdir -p "$apache_bin" "$xdg_bin" "$xdg_data"
          printf '#!/usr/bin/env bash\necho "Apache Hive 3.1.0"\n' > "$apache_bin/hive"
          chmod +x "$apache_bin/hive"
          FIXTURES="$fixtures" HIVE_DAEMON_ENV_CAPTURE="$fixtures/invoked-bin" XDG_BIN_HOME="$xdg_bin" XDG_DATA_HOME="$xdg_data" PATH="$fakebin:$apache_bin:$xdg_bin:$PATH" bash install.sh --version=v0.1.0 >"$fixtures/install.out" 2>"$fixtures/install.err"
          grep -q "daemon autostart enabled via hive daemon install (written)" "$fixtures/install.out"
          grep -qx "$xdg_bin/hive" "$fixtures/invoked-bin"
          test -L "$xdg_bin/hv"
          "$xdg_bin/hv" --version | grep -q '^0\.1\.0$'
          test -L "$xdg_bin/qmd"
          "$xdg_bin/qmd" --version | grep -q '^qmd fixture$'

  unsupported-platforms:
    name: install.sh unsupported platform messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Alpine/musl exits tier-3
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest \
            sh -lc 'apk add --no-cache bash >/dev/null && set +e && bash install.sh --dry-run --version=v0.1.0 2>/tmp/hive-install.err; rc=$?; set -e; test "$rc" -ne 0; grep -q "musl Linux is tier-3" /tmp/hive-install.err'
      - name: Unknown Linux architecture exits clearly
        run: |
          set -euo pipefail
          fakebin="$(mktemp -d)"
          cat > "$fakebin/uname" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            -s) echo Linux ;;
            -m) echo sparc64 ;;
            *) /usr/bin/uname "$@" ;;
          esac
          SH
          chmod +x "$fakebin/uname"
          set +e
          PATH="$fakebin:$PATH" bash install.sh --dry-run --version=v0.1.0 2>"$fakebin/err"
          rc=$?
          set -e
          [[ "$rc" -ne 0 ]] || { echo "expected unsupported architecture to fail" >&2; exit 1; }
          grep -q "unsupported Linux architecture: sparc64" "$fakebin/err"
