    lock_contracts:
      - "No-follow identity checks and atomic per-file restore; same-user application custody only, with no sandbox or filesystem transaction claim"
    component_dependencies: []
    allowed_hive_dependencies:
      - hive/atomic_file
      - hive/secret_patterns
    internal_collaborators:
