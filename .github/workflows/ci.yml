name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: rake test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run minitest suite with merged coverage report
        env:
          HIVE_COVERAGE_MIN_LINE: "100"
        run: bundle exec rake coverage

  e2e:
    name: real CLI scenario harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install tmux for TUI scenarios
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Run harness library tests
        run: bundle exec rake e2e:lib_test
      - name: Run real-subprocess scenarios
        env:
          HIVE_E2E_RUNS_DIR: ${{ runner.temp }}/hive-e2e-runs
        run: bundle exec rake e2e
      - name: Enforce incident duration budgets
        env:
          HIVE_E2E_RUNS_DIR: ${{ runner.temp }}/hive-e2e-runs
        run: bundle exec ruby test/e2e/check_incident_budget.rb "$HIVE_E2E_RUNS_DIR"
      - name: Retain e2e reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-e2e-report
          path: ${{ runner.temp }}/hive-e2e-runs
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Hive web (Rails tests + system)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: web
      - name: Install Playwright chromium for Capybara system tests
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Rails integration tests
        run: bin/rails test
      - name: Rails system tests (Capybara + Playwright)
        run: bin/rails test:system
      - name: Install the gem bundle (the golden-path E2E spawns a real daemon)
        working-directory: .
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          BUNDLE_PATH: ${{ github.workspace }}/vendor/root-bundle
          BUNDLE_DEPLOYMENT: ""
          BUNDLE_FROZEN: ""
        run: bundle install --jobs 4
      - name: Hive web golden-path E2E (claim → idea → Q&A → daemon → PR gate)
        env:
          GOLDEN_E2E_BUNDLE_PATH: ${{ github.workspace }}/vendor/root-bundle
        run: bin/rails test test/e2e/golden_path_e2e.rb
      - name: rubocop (web)
        run: bin/rubocop --format github

  # Hosted Windows runners cannot run Linux containers (Windows-container
  # mode only, no WSL2) — the per-OS surface that CAN break is our
  # PowerShell installer. Run it on real Windows PowerShell with a stubbed
  # docker: failure copy, $LASTEXITCODE handling, argv shape.
  hivebox-installer-windows:
    name: hivebox installer (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check both installers
        shell: pwsh
        run: |
          $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("packaging/docker/install-box.ps1", [ref]$null, [ref]$err)
          if ($err) { $err; exit 1 }
      - name: Exercise install-box.ps1 against a stubbed docker
        shell: pwsh
        run: packaging/docker/test-install-box.ps1

  rubocop:
    name: rubocop (37signals omakase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop --parallel --format github

  brakeman:
    name: brakeman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec brakeman --force --no-pager --quiet --format github --ignore-config config/brakeman.ignore

  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update

  # The launchd path in Commands::ServiceInstaller::Base (plist write +
  # `launchctl load` + the `launchctl list <label>` enabled-probe, plus the
  # web plist's `/Users/YOU` WorkingDirectory rewrite) is macOS-only, so unit
  # tests can only stub launchctl. This job exercises the real round-trip on a
  # hosted macOS runner (which runs the user in a GUI session, so user-agent
  # `launchctl load` works). Scope is the install mechanics — not that the
  # service stays up (that needs the web bundle / a bound port). No untrusted
  # workflow input is used in any run step.
  launchd-macos:
    name: launchd service install (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: daemon launchd install round-trip
        run: |
          set -euo pipefail
          plist="$HOME/Library/LaunchAgents/local.hive-daemon.plist"
          bundle exec hive daemon install --force
          test -f "$plist" || { echo "daemon plist not written to $plist" >&2; exit 1; }
          if grep -q "/Users/YOU" "$plist"; then echo "daemon plist WorkingDirectory placeholder not rewritten" >&2; exit 1; fi
          if ! launchctl list | grep -q local.hive-daemon; then echo "daemon job not loaded into launchd" >&2; exit 1; fi
          # Status exits non-zero when the daemon isn't running (RunAtLoad may
          # not stay up without a bundle-context ExecStart), so tolerate it and
          # assert only the install/enabled fields the launchd path controls.
          out="$(bundle exec hive daemon status --json || true)"
          echo "$out" | grep -o '{.*}' \
            | ruby -rjson -e 'd = JSON.parse($stdin.read); abort("daemon status: service not installed/enabled") unless d["service_installed"] && d["service_enabled"]'
      - name: web launchd install round-trip (plist + WorkingDirectory rewrite)
        run: |
          set -euo pipefail
          plist="$HOME/Library/LaunchAgents/local.hive-web.plist"
          # --no-bootstrap: skip the managed-web-bundle fetch (its release asset
          # doesn't exist until a version is tagged, so a plain `install` 404s).
          # The plist's WorkingDirectory is rewritten to $HOME, not the app dir,
          # so the install mechanics need no bundle. The readiness contract
          # deliberately exits non-zero when that unbootstrapped service cannot
          # answer /health; validate the emitted install state before accepting
          # that bounded not-ready outcome.
          set +e
          out="$(bundle exec hive web install --no-bootstrap --json)"
          web_install_rc=$?
          set -e
          # Ruby expands its own $stdin and interpolation; Bash must preserve them.
          # shellcheck disable=SC2016
          printf '%s\n' "$out" \
            | WEB_INSTALL_RC="$web_install_rc" WEB_PLIST="$plist" ruby -rjson -e '
              d = JSON.parse($stdin.read)
              mechanics = d["schema"] == "hive-web-install" &&
                d["platform"] == "macos" &&
                d["target_path"] == ENV.fetch("WEB_PLIST") &&
                d["outcome"] == "written" &&
                d["service_manager_available"] &&
                d["service_installed"] &&
                d["service_enabled"]
              rc = Integer(ENV.fetch("WEB_INSTALL_RC"))
              readiness = if rc.zero?
                d["ok"] && d["ready"] && d["readiness"] == "ready"
              else
                rc == 1 && !d["ok"] && !d["ready"] &&
                  %w[inactive active_not_ready].include?(d["readiness"])
              end
              abort("web install: invalid launchd mechanics/readiness envelope: #{d.inspect}") unless mechanics && readiness
            '
          test -f "$plist" || { echo "web plist not written to $plist" >&2; exit 1; }
          if grep -q "/Users/YOU" "$plist"; then echo "web plist WorkingDirectory placeholder not rewritten to \$HOME" >&2; exit 1; fi
          if ! launchctl list | grep -q local.hive-web; then echo "web job not loaded into launchd" >&2; exit 1; fi
      - name: teardown (unload the test agents)
        if: always()
        run: |
          for label in local.hive-daemon local.hive-web; do
            plist="$HOME/Library/LaunchAgents/$label.plist"
            [ -f "$plist" ] || continue
            launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null \
              || launchctl unload "$plist" 2>/dev/null || true
          done
