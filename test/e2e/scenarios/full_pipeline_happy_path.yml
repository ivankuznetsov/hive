name: full_pipeline_happy_path
description: Real bin/hive subprocess flow from inbox to done without network PR creation.
tags: [happy-path, cli-only]
steps:
  - kind: cli
    args: [new, "{project}", "demo idea"]
  - kind: cli
    args: [brainstorm, "{slug}", --from, 1-inbox]
    env:
      HIVE_FAKE_CLAUDE_WRITE_FILE: "{task_dir:2-brainstorm}/brainstorm.md"
      HIVE_FAKE_CLAUDE_WRITE_CONTENT: "# Brainstorm\n\n<!-- COMPLETE -->\n"
  - kind: state_assert
    path: "{task_dir:2-brainstorm}/brainstorm.md"
    marker: { current: COMPLETE }
  - kind: cli
    args: [plan, "{slug}", --from, 2-brainstorm]
    env:
      HIVE_FAKE_CLAUDE_WRITE_FILE: "{task_dir:3-plan}/plan.md"
      HIVE_FAKE_CLAUDE_WRITE_CONTENT: "# Plan\n\n<!-- COMPLETE -->\n"
  - kind: state_assert
    path: "{task_dir:3-plan}/plan.md"
    marker: { current: COMPLETE }
  - kind: cli
    args: [develop, "{slug}", --from, 3-plan]
  - kind: state_assert
    path: "{task_dir:4-execute}/task.md"
    marker: { current: EXECUTE_COMPLETE }
  # AC1: PR-first pipeline routes through 5-open-pr BEFORE 6-review.
  # This scenario stays network-free (no fake-gh in PATH), so it seeds
  # 5-open-pr's pr.md directly instead of running `hive open-pr` (which
  # would call `gh auth status` / `gh pr create`). The seed proves the
  # stage transition contract; run_open_pr_test.rb covers the runner.
  - kind: cli
    args: [approve, "{slug}", --from, 4-execute, --to, 5-open-pr]
  - kind: write_file
    path: "{task_dir:5-open-pr}/pr.md"
    content: "---\npr_url: https://example.com/pr/1\npr_number: 1\n---\n\n<!-- COMPLETE pr_url=https://example.com/pr/1 is_draft=true -->\n"
  - kind: cli
    args: [review, "{slug}", --from, 5-open-pr]
  - kind: state_assert
    path: "{task_dir:6-review}/task.md"
    marker: { current: REVIEW_COMPLETE }
  - kind: cli
    args: [approve, "{slug}", --from, 6-review, --to, 7-finalize]
  - kind: write_file
    path: "{task_dir:7-finalize}/pr.md"
    content: "# PR\n\n<!-- COMPLETE pr_url=https://example.com/pr/1 -->\n"
  - kind: cli
    args: [archive, "{slug}", --from, 7-finalize]
  - kind: json_assert
    args: [status, --json]
    schema: hive-status
    pick: [projects, 0, tasks, 0, stage]
    equals: 8-done
