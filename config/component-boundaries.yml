schema_version: 1

# Architecture metadata for Hive-first reusable components. This catalog and
# its test-only contract enforce declared source boundaries; they are not a
# runtime security sandbox and cannot prevent reflection or monkeypatching.
components:
  - id: attempts
    name: Attempts admission / future RunReceipt
    state: candidate
    entrypoint:
      file: lib/hive/attempts/api.rb
      require: hive/attempts/api
      constant: Hive::Attempts::API
    public_contract:
      values:
        - Hive::Attempts::ClientResult
        - Hive::Attempts::DispatchResult
      errors:
        - Hive::Attempts::UnsupportedDetachment
    owned_paths:
      - lib/hive/attempts
    state_contracts:
      - "$HIVE_HOME/attempts/v2 records, framed logs, outputs, generation locks, leases, receipts, and lost-outcome evidence"
    schema_contracts:
      - "hive-attempt v2 is the only runtime reader/writer; Hive::Recovery::Migration owns the one-off cutover"
    lock_contracts:
      - "admission lock before generation lock; record transitions use guarded CAS"
    component_dependencies:
      - work-ledger
    allowed_hive_dependencies:
      - hive/agent_limit
      - hive/atomic_file
      - hive/conditions/generation_tracker
      - hive/config
      - hive/dependency_snapshot
      - hive/lock
      - hive/markers
      - hive/paths
      - hive/stringify_keys
      - hive/task
      - hive/task_resolver
    internal_collaborators:
      - Hive::Attempts::Entrypoint
      - Hive::Attempts::ConfiguredDispatcher
      - Hive::Attempts::Dispatcher
      - Hive::Attempts::DetachedLauncher
      - Hive::Attempts::Client
      - Hive::Attempts::Store
      - Hive::Attempts::Supervisor
      - Hive::Attempts::Reconciler
      - Hive::Attempts::ProcessIdentity
      - Hive::Attempts::CapacitySnapshot
      - Hive::Attempts::LostOutcomeStore
      - Hive::Attempts::LostOutcomeProcessor
    forbidden_constructions:
      - Hive::Attempts::Entrypoint
      - Hive::Attempts::ConfiguredDispatcher
      - Hive::Attempts::Dispatcher
      - Hive::Attempts::DetachedLauncher
      - Hive::Attempts::Client
      - Hive::Attempts::Store
      - Hive::Attempts::Supervisor
      - Hive::Attempts::Reconciler
      - Hive::Attempts::ProcessIdentity
      - Hive::Attempts::CapacitySnapshot
      - Hive::Attempts::LostOutcomeStore
      - Hive::Attempts::LostOutcomeProcessor
    authorized_internal_constructions:
      - constant: Hive::Attempts::Store
        files:
          - lib/hive/commands/attempt_supervise.rb
          - lib/hive/commands/daemon.rb
          - lib/hive/conditions/execute_boundary.rb
          - lib/hive/implementation_identity/store.rb
          - lib/hive/task_closure.rb
          - lib/hive/task_projection/store.rb
        reason: "Existing Hive composition, read-only compatibility, and closure-verification adapters share the canonical durable store; they are not alternate admission producers."
      - constant: Hive::Attempts::Supervisor
        files:
          - lib/hive/commands/attempt_supervise.rb
        reason: "The private supervisor argv adapter is the process handoff owned by DetachedLauncher."
      - constant: Hive::Attempts::Reconciler
        files:
          - lib/hive/commands/daemon.rb
        reason: "The daemon composition root injects reconciliation into its scheduler without exposing lifecycle operations through the admission facade."
      - constant: Hive::Attempts::ProcessIdentity
        files:
          - lib/hive/commands/daemon.rb
        reason: "The daemon composition root shares one process-identity verifier across reconciliation and loss handling."
      - constant: Hive::Attempts::LostOutcomeStore
        files:
          - lib/hive/commands/daemon.rb
        reason: "The daemon composition root owns internal loss evidence persistence and injection."
      - constant: Hive::Attempts::LostOutcomeProcessor
        files:
          - lib/hive/commands/daemon.rb
        reason: "The daemon composition root owns internal loss-policy wiring; it is not a public recovery operation."
    hive_consumers:
      - lib/hive/commands/run.rb
      - lib/hive/commands/stage_action.rb
      - lib/hive/commands/daemon.rb
      - lib/hive/bot/dispatch_request_writer.rb
    mutation_authority: "The facade accepts explicit admission requests; named Hive composition sites wire internal stores and supervisors that retain durable transition authority."
    recovery_surface: "The facade admits successors; reconciliation, healing, cancellation, export, and generic lifecycle policy remain internal."
    wiki_page: wiki/modules/attempts.md
    focused_tests:
      - test/unit/attempts/api_test.rb
    migration_exceptions:
      - reason: "WorkLedger-owned lib/hive/task_projection/store.rb still requires and constructs Hive::Attempts::Store, creating a reciprocal Attempts/WorkLedger source edge that blocks an acyclic boundary-ready graph."
        removal_unit: U8

  - id: user-service
    name: UserService
    state: boundary-ready
    entrypoint:
      file: lib/hive/user_service.rb
      require: hive/user_service
      constant: Hive::UserService
    public_contract:
      values:
        - Hive::UserService::Definition
        - Hive::UserService::Plan
        - Hive::UserService::Status
        - Hive::UserService::Result
      errors:
        - ArgumentError
    owned_paths:
      - lib/hive/user_service.rb
      - lib/hive/user_service
    state_contracts:
      - "Per-user systemd unit or launchd plist, manager observations, and timestamped backups"
    schema_contracts:
      - "Definition, Plan, Status, and Result are platform-neutral; Hive command JSON and messages remain adapter-owned"
    lock_contracts:
      - "No cross-manager transaction; apply and remove revalidate the exact observed file and manager state before mutation"
    component_dependencies: []
    allowed_hive_dependencies:
      - hive/atomic_file
    internal_collaborators:
      - Hive::UserService::Manager
    forbidden_constructions:
      - Hive::UserService::Manager
    authorized_internal_constructions: []
    hive_consumers:
      - lib/hive/commands/service_installer/base.rb
      - lib/hive/commands/daemon/service_installer.rb
      - lib/hive/commands/bot/service_installer.rb
      - lib/hive/commands/web/service_installer.rb
      - lib/hive/commands/daemon.rb
      - lib/hive/commands/bot.rb
      - lib/hive/commands/web.rb
      - lib/hive/commands/setup.rb
      - lib/hive/commands/init.rb
      - lib/hive/commands/uninstall.rb
      - lib/hive/web/service_status.rb
    mutation_authority: "Hive command adapters authorize install, force replacement, restart, and remove."
    recovery_surface: "Typed outcomes report backup paths, final observed state, and partial manager/file failures."
    wiki_page: wiki/modules/user_service.md
    focused_tests:
      - test/unit/user_service/user_service_test.rb
      - test/unit/commands/service_installer/base_test.rb
      - test/unit/commands/daemon/service_installer_test.rb
      - test/unit/commands/bot/service_installer_test.rb
      - test/unit/commands/web/service_installer_test.rb
      - test/unit/commands/uninstall_test.rb
    migration_exceptions: []

