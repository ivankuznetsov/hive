schema: "hive-module/v1"
name: "architecture-patrol"
version: "0.1.0"
description: "First-party current-main and merged-PR Architecture Patrol adapter"
type: "architecture-patrol"
author:
  name: "Hive"
  url: "https://hivecli.sh"
license: "MIT"
hive_min_version: "0.6.7"
source:
  url: "https://github.com/ivankuznetsov/hive"
  revision: "913c11a83e892792354f612ea47b27d868ad0e6b"
workflows: []
hooks:
  -
    id: "setup"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.setup"
    default_enabled: true
    schedules: []
    events:
      - "project.registered"
    concurrency: "drop"
  -
    id: "scheduled-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.scheduled-discovery"
    default_enabled: false
    schedules:
      - "*/10 * * * *"
    events: []
    concurrency: "drop"
  -
    id: "merged-pr-discovery"
    target:
      kind: "entrypoint"
      id: "architecture-patrol.merged-pr-discovery"
    default_enabled: false
    schedules: []
    events:
      - "pull_request.merged"
    concurrency: "drop"
settings:
  -
    name: "shadow_mode"
    type: "boolean"
    required: true
    default: true
    description: "Evaluate without claiming or invoking Architecture Patrol work"
  -
    name: "dry_run"
    type: "boolean"
    required: true
    default: false
    description: "Retain the legacy Architecture Patrol dry-run execution mode"
permissions:
  repository_write: true
  github_mutations: []
  external_commands:
    - "git"
  network_hosts: []
  filesystem_read:
    - "repository"
  filesystem_write:
    - ".hive-state/refactor_patrol/**"
  secrets: []
templates:
  - "templates/refactor-patrol.yml"
docs:
  - "README.md"
files:
  "README.md": "5e1cbd44c3f8a784188e66e804a73f8d6b09e1524f6eb3a1d64d7ef14e1ed26c"
  "templates/refactor-patrol.yml": "af33e28f26e34ab34916a003625a772ce939d9f04ad4e74d811f153c8d394e48"
release_sha256: "fcc488f91fde43590ccea1b8f993575696b83c6497d7eca59893b7f0d050fc8a"
