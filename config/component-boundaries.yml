      - lib/hive/claude_launcher.rb
      - lib/hive/stages/execute.rb
      - lib/hive/stages/finalize.rb
      - lib/hive/stages/open_pr.rb
      - lib/hive/stages/review.rb
      - lib/hive/stages/review/ci_fix.rb
      - lib/hive/stages/review/triage.rb
      - lib/hive/stages/agent_worktree.rb
    mutation_authority: "Hive stage adapters declare protected, allowed, and required paths."
    recovery_surface: "Typed reports distinguish tampering, output rejection, verified restoration, and restoration failure with bounded redacted diagnostics."
    wiki_page: wiki/modules/protected_files.md
    focused_tests:
