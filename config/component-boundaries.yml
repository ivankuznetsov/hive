    state_contracts:
      - "An absent routing.pool returns a structural legacy policy before global account, health, or capacity state is consulted"
      - "An explicit policy freezes ordered account, adapter, launch-binding, model, effort, capability, requirement, and pin identity"
      - "Provider-account identity is separate from the existing adapter/profile provider identity"
      - "Explicit policies are first-writer-wins runtime-control-plane rows keyed by ownership generation and durable subject; legacy mode performs no repository I/O"
    schema_contracts:
      - "The v1 canonical digest covers every normalized selection input and no credential material"
      - "Account, route, requirements, pin, policy, request, and decision values are deeply immutable"
    lock_contracts:
      - "Policy construction and static compatibility filtering are pure and acquire no lock"
      - "Router selection consumes immutable health and capacity observations and acquires no lock"
      - "Admission, health, capacity, retry, and recovery locks remain outside this component"
    component_dependencies:
