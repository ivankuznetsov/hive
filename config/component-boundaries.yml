    mutation_authority: "The separate ordinary and architecture gateways authorize product sinks; ordinary Patrol StateStore is the sole non-admitted projector of an already-authorized pull-request publication receipt, explicit intake, discovery, and action transition facades are the only semantic JobStore mutator call sites, the confirmed reset command alone may invoke the opaque cross-generation archive, and shared values, OccurrenceJournal, EvidenceStore, verification, duplicate indexing, qualification, and report projection contain no product policy or execution authority."
    recovery_surface: "StateStore and JobStore are the only product recovery authorities over the single OccurrenceJournal mechanic; ordinary Patrol drains typed publication entries before suppression reads and acknowledges only after an exact binding write or no-op, while EvidenceStore remains observation-only and ReportMigration is confined to one-off project-local report schema conversion."
