name: Release candidate
run-name: hive-release-candidate:${{ inputs.request_id }}:${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full protected-main candidate commit SHA
        required: true
        type: string
      request_id:
        description: Client-generated request identity
        required: true
        type: string
      action_lock_sha256:
        description: SHA-256 of the candidate workflow action lock
        required: true
        type: string
      source_run_id:
        description: Exact predecessor run for a targeted retry
        required: false
        type: string
      source_run_attempt:
        description: Exact predecessor attempt for a targeted retry
        required: false
        type: string
      source_artifact_id:
        description: Exact immutable predecessor candidate artifact
        required: false
        type: string
      source_artifact_digest:
        description: Exact predecessor candidate artifact digest
        required: false
        type: string
      source_artifact_run_id:
        description: Original producer run for the predecessor candidate artifact
        required: false
        type: string
      source_artifact_run_attempt:
        description: Original producer attempt for the predecessor candidate artifact
        required: false
        type: string
      source_artifact_name:
        description: Exact predecessor candidate artifact name
        required: false
        type: string
      selector:
        description: Canonical JSON retry selector
        required: false
        type: string

concurrency:
  group: release-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate protected candidate identity
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
      action_lock_sha256: ${{ steps.identity.outputs.action_lock_sha256 }}
      retry: ${{ steps.identity.outputs.retry }}
      selected_gates: ${{ steps.identity.outputs.selected_gates }}
      source_evidence_sha256: ${{ steps.identity.outputs.source_evidence_sha256 }}
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected-main reachability and trusted workflow revision
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          ACTION_LOCK_SHA256: ${{ inputs.action_lock_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          SOURCE_ARTIFACT_RUN_ID: ${{ inputs.source_artifact_run_id }}
          SOURCE_ARTIFACT_RUN_ATTEMPT: ${{ inputs.source_artifact_run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          SELECTOR: ${{ inputs.selector }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^req-[a-z0-9]{6,48}$ ]]
          [[ "$ACTION_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          protected="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r .protected)"
          test "$protected" = "true"
          workflow_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$workflow_sha" = "$GITHUB_SHA"
          trusted_control="$RUNNER_TEMP/trusted-control"
          install -d -m 0700 "$trusted_control"
          git archive "$workflow_sha" packaging/release_candidate |
            tar -x -C "$trusted_control"
          computed_action_lock="$(
            WORKFLOW_SHA="$workflow_sha" ruby -rdigest -rjson -e '
              paths = %w[.github/workflows/release-candidate.yml .github/workflows/release.yml]
              rows = paths.sort.flat_map do |path|
                source = IO.popen(
                  ["git", "show", "#{ENV.fetch("WORKFLOW_SHA")}:#{path}"],
                  err: File::NULL, &:read
                )
                abort("cannot read trusted workflow #{path}") unless $?.success?
                source.lines.filter_map do |line|
                  match = line.match(/^\s*(?:-\s*)?uses:\s+([^@\s]+)(?:@([^#\s]+))?/)
                  next unless match
                  next if match[1].start_with?("./")
                  abort("mutable Action ref: #{match[1]}@#{match[2]}") unless
                    match[2]&.match?(/\A[0-9a-f]{40}\z/)
                  {"workflow" => path, "action" => match[1], "revision" => match[2]}
                end
              end
              print Digest::SHA256.hexdigest(JSON.generate(rows))
            '
          )"
          test "$computed_action_lock" = "$ACTION_LOCK_SHA256"
          retry=false
          selected_gates="$(
            ruby -I"$trusted_control" \
              -r"$trusted_control/packaging/release_candidate/aggregate" -rjson -e \
              'print JSON.generate(HiveReleaseCandidate::Aggregate::REQUIRED_JOBS.sort)'
          )"
          source_evidence_sha256=""
          if [[ -n "$SOURCE_RUN_ID$SOURCE_RUN_ATTEMPT$SOURCE_ARTIFACT_ID$SOURCE_ARTIFACT_DIGEST$SOURCE_ARTIFACT_RUN_ID$SOURCE_ARTIFACT_RUN_ATTEMPT$SOURCE_ARTIFACT_NAME$SELECTOR" ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$SOURCE_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "$SOURCE_ARTIFACT_NAME" = \
              "hive-release-candidate-${SOURCE_ARTIFACT_RUN_ID}-${SOURCE_ARTIFACT_RUN_ATTEMPT}"
            ruby -rjson -e '
              value = JSON.parse(ENV.fetch("SELECTOR"))
              abort "invalid selector" unless %w[failed missing named].include?(value["mode"])
              abort "named selector needs gates" if value["mode"] == "named" && Array(value["gates"]).empty?
            '
            source_run="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
            )"
            test "$(jq -r .id <<<"$source_run")" = "$SOURCE_RUN_ID"
            test "$(jq -r .run_attempt <<<"$source_run")" = "$SOURCE_RUN_ATTEMPT"
            test "$(jq -r .head_sha <<<"$source_run")" = "$workflow_sha"
            test "$(jq -r .path <<<"$source_run")" = ".github/workflows/release-candidate.yml"
            test "$(jq -r .event <<<"$source_run")" = workflow_dispatch
            test "$(jq -r .status <<<"$source_run")" = completed
            source_artifact="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}"
            )"
            test "$(jq -r .id <<<"$source_artifact")" = "$SOURCE_ARTIFACT_ID"
            test "$(jq -r .digest <<<"$source_artifact")" = "$SOURCE_ARTIFACT_DIGEST"
            test "$(jq -r .expired <<<"$source_artifact")" = false
            test "$(jq -r .name <<<"$source_artifact")" = "$SOURCE_ARTIFACT_NAME"
            test "$(jq -r .workflow_run.id <<<"$source_artifact")" = "$SOURCE_ARTIFACT_RUN_ID"
            test "$(jq -r .workflow_run.head_sha <<<"$source_artifact")" = "$workflow_sha"
            source_artifacts="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100"
            )"
            evidence_name="hive-release-candidate-evidence-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
            test "$(jq --arg name "$evidence_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$source_artifacts")" = 1
            source_dir="$RUNNER_TEMP/source-evidence"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "hive-release-candidate-evidence-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
              --dir "$source_dir"
            source_evidence="$source_dir/evidence.json"
            test "$(jq -r .candidate_sha "$source_evidence")" = "$CANDIDATE_SHA"
            test "$(jq -r .repository "$source_evidence")" = "$GITHUB_REPOSITORY"
            test "$(jq -r .trust_scope "$source_evidence")" = trusted_remote
            test "$(jq -r .workflow_sha "$source_evidence")" = "$workflow_sha"
            test "$(jq -r .run_id "$source_evidence")" = "$SOURCE_RUN_ID"
            test "$(jq -r .run_attempt "$source_evidence")" = "$SOURCE_RUN_ATTEMPT"
            test "$(jq -r .action_lock_sha256 "$source_evidence")" = "$ACTION_LOCK_SHA256"
            test "$(jq -r .artifact.id "$source_evidence")" = "$SOURCE_ARTIFACT_ID"
            test "$(jq -r .artifact.digest "$source_evidence")" = "$SOURCE_ARTIFACT_DIGEST"
            test "$(jq -r .artifact.name "$source_evidence")" = "$SOURCE_ARTIFACT_NAME"
            test "$(jq -r .artifact.producer_run_id "$source_evidence")" = "$SOURCE_ARTIFACT_RUN_ID"
            test "$(jq -r .artifact.producer_run_attempt "$source_evidence")" = "$SOURCE_ARTIFACT_RUN_ATTEMPT"
            source_request="$(jq -r .request_id "$source_evidence")"
            [[ "$source_request" =~ ^req-[a-z0-9]{6,48}$ ]]
            test "$(jq -r .display_title <<<"$source_run")" = \
              "hive-release-candidate:${source_request}:${CANDIDATE_SHA}"
            selected_gates="$(
              ruby -I"$trusted_control" \
                -r"$trusted_control/packaging/release_candidate/aggregate" -rjson -e '
                source = JSON.parse(File.binread(ARGV.fetch(0)))
                selector = JSON.parse(ENV.fetch("SELECTOR"))
                names = HiveReleaseCandidate::RetrySelection.new(
                  required_names: HiveReleaseCandidate::Aggregate::REQUIRED_JOBS
                ).call(source: source, selector: selector)
                print JSON.generate(names)
              ' "$source_evidence"
            )"
            source_evidence_sha256="$(sha256sum "$source_evidence" | awk '{print $1}')"
            source_checks="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?check_name=hive-release-candidate"
            )"
            test "$(jq --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" \
              --arg digest "$source_evidence_sha256" '
                [.check_runs[] | select(
                  .name == "hive-release-candidate" and
                  .app.slug == "github-actions" and
                  .status == "completed" and
                  (.conclusion == "success" or .conclusion == "failure") and
                  ((.details_url // "") | contains("/actions/runs/" + $run)) and
                  .external_id == ("hive-release-candidate:v1:" + $run + ":" + $attempt + ":" + $digest)
                )] | length
              ' <<<"$source_checks")" = 1
            retry=true
          fi
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"
          echo "action_lock_sha256=$computed_action_lock" >> "$GITHUB_OUTPUT"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          echo "selected_gates=$selected_gates" >> "$GITHUB_OUTPUT"
          echo "source_evidence_sha256=$source_evidence_sha256" >> "$GITHUB_OUTPUT"

  candidate:
    name: Candidate artifact identity
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.identity.outputs.artifact_id }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      candidate_version: ${{ steps.verify.outputs.candidate_version }}
      artifact_producer_run_id: ${{ steps.identity.outputs.artifact_producer_run_id }}
      artifact_producer_run_attempt: ${{ steps.identity.outputs.artifact_producer_run_attempt }}
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the manifest-bound candidate exactly once
        if: inputs.source_run_id == ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          ruby -I. -r./packaging/release_candidate/artifacts -e '
            HiveReleaseCandidate::Artifacts.new(
              repo_root: Dir.pwd,
              candidate_sha: ENV.fetch("CANDIDATE_SHA"),
              candidate_dir: File.join(ENV.fetch("RUNNER_TEMP"), "candidate")
            ).call
          '
      - name: Upload exact candidate artifacts
        if: inputs.source_run_id == ''
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30
      - name: Download exact predecessor candidate for retry
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source_artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Bind candidate artifact identity
        id: identity
        env:
          RETRY: ${{ needs.validate.outputs.retry }}
          UPLOAD_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          SOURCE_ARTIFACT_RUN_ID: ${{ inputs.source_artifact_run_id }}
          SOURCE_ARTIFACT_RUN_ATTEMPT: ${{ inputs.source_artifact_run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
        run: |
          set -euo pipefail
          if test "$RETRY" = "true"; then
            artifact_id="$SOURCE_ARTIFACT_ID"
            artifact_digest="$SOURCE_ARTIFACT_DIGEST"
            artifact_name="$SOURCE_ARTIFACT_NAME"
            artifact_producer_run_id="$SOURCE_ARTIFACT_RUN_ID"
            artifact_producer_run_attempt="$SOURCE_ARTIFACT_RUN_ATTEMPT"
          else
            artifact_id="$UPLOAD_ID"
            artifact_digest="$UPLOAD_DIGEST"
            if [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
              artifact_digest="sha256:${artifact_digest}"
            fi
            artifact_name="hive-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            artifact_producer_run_id="$GITHUB_RUN_ID"
            artifact_producer_run_attempt="$GITHUB_RUN_ATTEMPT"
          fi
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_producer_run_id=$artifact_producer_run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_producer_run_attempt=$artifact_producer_run_attempt" >> "$GITHUB_OUTPUT"
      - name: Verify exact candidate filenames and bytes
        id: verify
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test -f "$RUNNER_TEMP/candidate/manifest.json"
          ruby -rjson -rdigest -e '
            root = File.join(ENV.fetch("RUNNER_TEMP"), "candidate")
            manifest = JSON.parse(File.binread("#{root}/manifest.json"))
            abort "candidate SHA mismatch" unless manifest["candidate_sha"] == ENV.fetch("CANDIDATE_SHA")
            expected = %w[gem skills source web]
            abort "candidate kind set mismatch" unless manifest.fetch("files").values.map { _1["kind"] }.sort == expected
            manifest.fetch("files").each do |name, row|
              path = File.join(root, name)
              abort "unsafe filename" unless File.basename(name) == name
              abort "size mismatch" unless File.size(path) == row["size"]
              abort "digest mismatch" unless Digest::SHA256.file(path).hexdigest == row["sha256"]
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { _1.puts "candidate_version=#{manifest.fetch("hive_version")}" }
          '

  catalog:
    name: Catalog integrity
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Catalog integrity') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before catalog execution
        env: &gate_identity
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ needs.validate.outputs.workflow_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          ACTION_LOCK_SHA256: ${{ needs.validate.outputs.action_lock_sha256 }}
          ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.candidate.outputs.artifact_name }}
          ARTIFACT_PRODUCER_RUN_ID: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          ARTIFACT_PRODUCER_RUN_ATTEMPT: ${{ needs.candidate.outputs.artifact_producer_run_attempt }}
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Catalog integrity" catalog
      - name: Retain catalog gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-catalog
          path: ${{ runner.temp }}/gate-receipts/catalog.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run catalog contracts
        run: |
          bundle exec ruby -Itest test/e2e/lib/coverage_catalog_test.rb
          bundle exec ruby -Itest test/unit/packaging/release_candidate_baseline_catalog_test.rb

  release-e2e:
    name: Release E2E profile
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Release E2E profile') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before release E2E
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Release E2E profile" release-e2e
      - name: Retain release E2E gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-release-e2e
          path: ${{ runner.temp }}/gate-receipts/release-e2e.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run semantic release profile
        env:
          HIVE_E2E_RUNS_DIR: ${{ runner.temp }}/release-e2e
        run: bundle exec ruby bin/hive-e2e run --profile release

  package:
    name: Candidate package verification
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Candidate package verification') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before package verification
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Candidate package verification" package
      - name: Retain package gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-package
          path: ${{ runner.temp }}/gate-receipts/package.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify exact candidate package
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test -f "$RUNNER_TEMP/candidate/manifest.json"
          ruby -I. -r./packaging/release_candidate/artifacts -e '
            HiveReleaseCandidate::Artifacts.new(
              repo_root: Dir.pwd, candidate_sha: ENV.fetch("CANDIDATE_SHA"),
              candidate_dir: File.join(ENV.fetch("RUNNER_TEMP"), "candidate")
            ).verify!
          '
          bundle exec ruby -Itest test/unit/packaging/release_candidate_artifacts_test.rb

  managed-web:
    name: Managed web setup
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Managed web setup') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before managed web setup
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Managed web setup" managed-web
      - name: Retain managed web gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-managed-web
          path: ${{ runner.temp }}/gate-receipts/managed-web.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify managed web candidate
        run: |
          gem_file="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -name 'hive-cli-*.gem' -print -quit)"
          web_file="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -name 'hive-web-*.tar.gz' -print -quit)"
          install_root="$RUNNER_TEMP/hive-install"
          packaging/live_agent_skills/install_candidate_gem.sh "$gem_file" "$install_root"
          web_sha="$(ruby -rjson -e 'm=JSON.parse(File.read(File.join(ENV.fetch("RUNNER_TEMP"), "candidate", "manifest.json"))); puts m["files"].find { |_k,v| v["kind"]=="web" }[1]["sha256"]')"
          packaging/verify-managed-web-setup.sh \
            --hive-bin "$install_root/bin/hive" --archive "$web_file" \
            --sha256 "$web_sha" --prefix "$RUNNER_TEMP/managed"

  native:
    name: ${{ matrix.job_name }}
    needs: [validate, candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            job_name: Native candidate install (linux-x86_64)
            runner: ubuntu-24.04
          - platform: linux-arm64
            job_name: Native candidate install (linux-arm64)
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            job_name: Native candidate install (macos-arm64)
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before native install
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "${{ matrix.job_name }}" "native-${{ matrix.platform }}"
      - name: Retain native gate receipt
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/gate-receipts/native-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          ruby-version: "3.4"
      - name: Install exact candidate natively
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        run: |
          gem_file="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -name 'hive-cli-*.gem' -print -quit)"
          packaging/live_agent_skills/install_candidate_gem.sh "$gem_file" "$RUNNER_TEMP/native"
          test "$("$RUNNER_TEMP/native/bin/hive" --version)" = "${{ needs.candidate.outputs.candidate_version }}"

  upgrade:
    name: ${{ matrix.job_name }}
    needs: [validate, candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Latest stable upgrade (linux-x86_64)
            row: latest-stable
            platform: linux-x86_64
            runner: ubuntu-24.04
            image: ruby@sha256:236be7f834484bcc54f468f0c260e10c8a47364e712a58c6c21429e644b68e51
          - job_name: Latest stable upgrade (linux-arm64)
            row: latest-stable
            platform: linux-arm64
            runner: ubuntu-24.04-arm
            image: ruby@sha256:d2a2dedc408fc3247360ca97612356e9ef9c9f0a32d26af535fa87a96dc5e565
          - job_name: Latest stable upgrade (macos-arm64)
            row: latest-stable
            platform: macos-arm64
            runner: macos-15
            image: none
          - job_name: Legacy bench v0.4.1 upgrade (linux-x86_64)
            row: legacy-bench-v041
            platform: linux-x86_64
            runner: ubuntu-24.04
            image: ruby@sha256:236be7f834484bcc54f468f0c260e10c8a47364e712a58c6c21429e644b68e51
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - name: Prepare runner-owned staging roots
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        run: |
          cache_root="$RUNNER_TEMP/release-candidate-cache"
          run_root="$RUNNER_TEMP/release-candidate-run"
          control_root="$RUNNER_TEMP/release-candidate-control"
          install -d -m 0700 "$cache_root" "$run_root" "$control_root"
          cp -R .trusted-control/. "$control_root/"
          cp packaging/release_candidate/baselines.yml \
            "$control_root/packaging/release_candidate/baselines.yml"
          cp packaging/release_candidate/baseline_manifests/*.json \
            "$control_root/packaging/release_candidate/baseline_manifests/"
          cp Gemfile.lock "$control_root/Gemfile.lock"
          {
            echo "HIVE_RC_CACHE_ROOT=$cache_root"
            echo "HIVE_RC_RUN_ROOT=$run_root"
            echo "HIVE_RC_CONTROL_ROOT=$control_root"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before upgrade staging
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "${{ matrix.job_name }}" "upgrade-${{ matrix.row }}-${{ matrix.platform }}"
      - name: Retain upgrade gate receipt
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-upgrade-${{ matrix.row }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/gate-receipts/upgrade-${{ matrix.row }}-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install pinned cosign verifier
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1 installs cosign v2.5.3
        with:
          cosign-release: v2.5.3
      - name: Stage authenticated cache, attestations, and role-owned targets
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          install -d -m 0700 \
            "$HIVE_RC_RUN_ROOT/candidate" \
            "$HIVE_RC_RUN_ROOT/targets/${{ matrix.row }}" \
            "$HIVE_RC_RUN_ROOT/state" "$HIVE_RC_RUN_ROOT/upgrade" \
            "$HIVE_RC_RUN_ROOT/home" "$HIVE_RC_RUN_ROOT/hive" \
            "$HIVE_RC_RUN_ROOT/tmp" "$HIVE_RC_RUN_ROOT/xdg/config" \
            "$HIVE_RC_RUN_ROOT/xdg/cache" "$HIVE_RC_RUN_ROOT/xdg/data" \
            "$HIVE_RC_RUN_ROOT/xdg/state"
          cp -R "$RUNNER_TEMP/candidate/." "$HIVE_RC_RUN_ROOT/candidate/"
          HIVE_RC_REPO_ROOT="$HIVE_RC_CONTROL_ROOT" \
            ruby "$HIVE_RC_CONTROL_ROOT/packaging/release_candidate/hosted_stage.rb" fetch \
            "${{ matrix.row }}" "${{ matrix.platform }}" "$CANDIDATE_SHA"
          test -f "$HIVE_RC_RUN_ROOT/candidate/manifest.json"
          test -f "$HIVE_RC_RUN_ROOT/staged-inputs.json"
          chmod -R a-w "$HIVE_RC_CONTROL_ROOT" "$HIVE_RC_CACHE_ROOT"
      - name: Run installed historical producer and candidate without network
        if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), matrix.job_name) }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          ruby_bin_dir="$(dirname "$(command -v ruby)")"
          if test "$(uname -s)" = Linux; then
            docker run --rm --network=none --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=256 \
              --user="$(id -u):$(id -g)" \
              --tmpfs=/tmp:rw,nosuid,nodev,noexec,size=512m \
              --volume "$HIVE_RC_CONTROL_ROOT:/repo:ro" \
              --volume "$HIVE_RC_CACHE_ROOT:/cache:ro" \
              --volume "$HIVE_RC_RUN_ROOT:/run:rw" \
              --workdir /repo \
              --env HOME=/run/home --env HIVE_HOME=/run/hive \
              --env XDG_CONFIG_HOME=/run/xdg/config \
              --env XDG_CACHE_HOME=/run/xdg/cache \
              --env XDG_DATA_HOME=/run/xdg/data \
              --env XDG_STATE_HOME=/run/xdg/state \
              --env HIVE_RC_REPO_ROOT=/repo \
              --env HIVE_RC_CACHE_ROOT=/cache \
              --env HIVE_RC_RUN_ROOT=/run \
              "${{ matrix.image }}" \
              bash -ceu '
                ruby /repo/packaging/release_candidate/hosted_stage.rb install "$1" "$2" "$3"
                test -f /run/sandbox-attestation.json
                test -f /run/baseline-cache-attestation.json
                test -f "/run/targets/$1/baseline/target.json"
                test -f "/run/targets/$1/candidate/target.json"
                ruby /repo/packaging/release_candidate/hosted_upgrade_lane.rb "$1" "$2" "$3"
              ' sandbox "${{ matrix.row }}" "${{ matrix.platform }}" "$CANDIDATE_SHA"
          else
            profile="(version 1) (deny default) (allow process*) (allow file-read*) (allow file-write* (subpath \"$HIVE_RC_RUN_ROOT\")) (deny network*)"
            sandbox-exec -p "$profile" \
              env -i HOME="$HIVE_RC_RUN_ROOT/home" \
              HIVE_HOME="$HIVE_RC_RUN_ROOT/hive" \
              TMPDIR="$HIVE_RC_RUN_ROOT/tmp" \
              XDG_CONFIG_HOME="$HIVE_RC_RUN_ROOT/xdg/config" \
              XDG_CACHE_HOME="$HIVE_RC_RUN_ROOT/xdg/cache" \
              XDG_DATA_HOME="$HIVE_RC_RUN_ROOT/xdg/data" \
              XDG_STATE_HOME="$HIVE_RC_RUN_ROOT/xdg/state" \
              HIVE_RC_REPO_ROOT="$HIVE_RC_CONTROL_ROOT" \
              HIVE_RC_CACHE_ROOT="$HIVE_RC_CACHE_ROOT" \
              HIVE_RC_RUN_ROOT="$HIVE_RC_RUN_ROOT" \
              PATH="$ruby_bin_dir:/usr/local/bin:/usr/bin:/bin" \
              bash -ceu '
                ruby "$HIVE_RC_REPO_ROOT/packaging/release_candidate/hosted_stage.rb" install "$1" "$2" "$3"
                test -f "$HIVE_RC_RUN_ROOT/sandbox-attestation.json"
                test -f "$HIVE_RC_RUN_ROOT/baseline-cache-attestation.json"
                test -f "$HIVE_RC_RUN_ROOT/targets/$1/baseline/target.json"
                test -f "$HIVE_RC_RUN_ROOT/targets/$1/candidate/target.json"
                ruby "$HIVE_RC_REPO_ROOT/packaging/release_candidate/hosted_upgrade_lane.rb" "$1" "$2" "$3"
              ' sandbox "${{ matrix.row }}" "${{ matrix.platform }}" "$CANDIDATE_SHA"
          fi

  freshness:
    name: Baseline catalog freshness
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Baseline catalog freshness') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before freshness check
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Baseline catalog freshness" freshness
      - name: Retain freshness gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-freshness
          path: ${{ runner.temp }}/gate-receipts/freshness.json
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
      - name: Read reviewed stable row without credentials
        id: reviewed-stable
        run: |
          catalog_tag="$(ruby -I. -r./packaging/release_candidate/baseline_catalog -e 'puts HiveReleaseCandidate::BaselineCatalog.load("packaging/release_candidate/baselines.yml").latest_stable.tag')"
          echo "tag=$catalog_tag" >> "$GITHUB_OUTPUT"
      - name: Compare with current non-prerelease release
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_TAG: ${{ steps.reviewed-stable.outputs.tag }}
        run: |
          live_tag="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r .tag_name)"
          test "$CATALOG_TAG" = "$live_tag"

  candidate-version:
    name: Candidate version newer
    if: ${{ needs.validate.outputs.retry != 'true' || contains(fromJSON(needs.validate.outputs.selected_gates), 'Candidate version newer') }}
    needs: [validate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out trusted gate control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: .trusted-control
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          github-token: ${{ github.token }}
      - name: Attest exact producer before version check
        env: *gate_identity
        run: bash .trusted-control/packaging/release_candidate/verify_hosted_gate.sh "Candidate version newer" candidate-version
      - name: Retain candidate version gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}-candidate-version
          path: ${{ runner.temp }}/gate-receipts/candidate-version.json
          if-no-files-found: error
          retention-days: 30
      - name: Require separately prepared version to be newer than reviewed stable
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.candidate_version }}
        run: |
          baseline_version="$(
            ruby -I.trusted-control \
              -r./.trusted-control/packaging/release_candidate/baseline_catalog \
              -e 'puts HiveReleaseCandidate::BaselineCatalog.load(ARGV.fetch(0)).latest_stable.version' \
              packaging/release_candidate/baselines.yml
          )"
          BASELINE_VERSION="$baseline_version" ruby -rrubygems -e '
            exit(
              Gem::Version.new(ENV.fetch("CANDIDATE_VERSION")) >
                Gem::Version.new(ENV.fetch("BASELINE_VERSION")) ? 0 : 1
            )
          '

  ordinary-ci:
    name: Protected ordinary CI
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
    steps:
      - name: Select exact candidate-SHA protected CI aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?check_name=rake%20test%20%28Ruby%203.4%29")"
          count="$(jq '[.check_runs[] | select(
            .name == "rake test (Ruby 3.4)" and
            .head_sha == env.CANDIDATE_SHA and
            .app.slug == "github-actions" and
            .status == "completed" and
            .conclusion == "success"
          )] | length' <<<"$response")"
          test "$count" = 1

  attest:
    name: Attest closed candidate evidence
    if: ${{ always() }}
    needs:
      - validate
      - candidate
      - catalog
      - release-e2e
      - package
      - managed-web
      - native
      - upgrade
      - freshness
      - candidate-version
      - ordinary-ci
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      evidence_sha256: ${{ steps.attest.outputs.evidence_sha256 }}
    steps:
      - name: Check out trusted aggregate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-07-26
        with:
          ruby-version: "3.4"
      - name: Query exact jobs and ordinary CI identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/terminal-evidence"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > "$RUNNER_TEMP/terminal-evidence/jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?check_name=rake%20test%20%28Ruby%203.4%29" \
            > "$RUNNER_TEMP/terminal-evidence/checks.raw.json"
          cp "$RUNNER_TEMP/terminal-evidence/checks.raw.json" \
            "$RUNNER_TEMP/terminal-evidence/checks.json"
          mapfile -t ordinary_ids < <(
            jq -r '.check_runs[] | select(
              .name == "rake test (Ruby 3.4)" and
              .app.slug == "github-actions"
            ) | .details_url | capture("/actions/runs/(?<id>[0-9]+)").id' \
              "$RUNNER_TEMP/terminal-evidence/checks.raw.json"
          )
          if test "${#ordinary_ids[@]}" = 1; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ordinary_ids[0]}" \
              > "$RUNNER_TEMP/terminal-evidence/ordinary-run.json"
            jq --slurpfile run "$RUNNER_TEMP/terminal-evidence/ordinary-run.json" '
              .check_runs |= map(
                if .name == "rake test (Ruby 3.4)" and .app.slug == "github-actions"
                then . + {
                  workflow_path:$run[0].path,
                  run_id:$run[0].id,
                  run_attempt:$run[0].run_attempt
                }
                else .
                end
              )
            ' "$RUNNER_TEMP/terminal-evidence/checks.raw.json" \
              > "$RUNNER_TEMP/terminal-evidence/checks.json"
          fi
      - name: Collect exact gate receipts and predecessor evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_EVIDENCE_SHA256: ${{ needs.validate.outputs.source_evidence_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_root="$RUNNER_TEMP/terminal-evidence/receipts"
          mkdir -p "$receipt_root"
          artifacts="$RUNNER_TEMP/terminal-evidence/current-artifacts.json"
          receipt_errors="$RUNNER_TEMP/terminal-evidence/receipt-errors.txt"
          : > "$receipt_errors"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "$artifacts"
          while IFS=$'\t' read -r artifact_id artifact_name; do
            zip="$RUNNER_TEMP/terminal-evidence/${artifact_name}.zip"
            if gh api -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip" &&
                unzip -nq "$zip" -d "$receipt_root"; then
              :
            else
              printf '%s\n' "$artifact_name" >> "$receipt_errors"
            fi
          done < <(
            jq -r --arg prefix \
              "hive-release-candidate-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-" '
                .artifacts[] |
                select(.expired == false and (.name | startswith($prefix))) |
                [.id, .name] | @tsv
              ' "$artifacts"
          )
          ruby -rjson -e '
            rows = Dir.glob(File.join(ARGV.fetch(0), "*.json")).sort.filter_map do |path|
              JSON.parse(File.binread(path))
            rescue JSON::ParserError
              {"schema" => "invalid-receipt", "path" => File.basename(path)}
            end
            File.readlines(ARGV.fetch(1), chomp: true).reject(&:empty?).each do |name|
              rows << {"schema" => "invalid-receipt-artifact", "artifact_name" => name}
            end
            File.write(ARGV.fetch(2), JSON.generate("receipts" => rows))
          ' "$receipt_root" "$receipt_errors" \
            "$RUNNER_TEMP/terminal-evidence/receipts.json"
          if test -n "$SOURCE_RUN_ID"; then
            source_dir="$RUNNER_TEMP/terminal-evidence/source"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "hive-release-candidate-evidence-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
              --dir "$source_dir"
            actual="$(sha256sum "$source_dir/evidence.json" | awk '{print $1}')"
            test "$actual" = "$SOURCE_EVIDENCE_SHA256"
          fi
      - name: Build exact trusted aggregate
        id: attest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          WORKFLOW_SHA: ${{ needs.validate.outputs.workflow_sha }}
          ACTION_LOCK_SHA256: ${{ needs.validate.outputs.action_lock_sha256 }}
          ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.candidate.outputs.artifact_name }}
          ARTIFACT_PRODUCER_RUN_ID: ${{ needs.candidate.outputs.artifact_producer_run_id }}
          ARTIFACT_PRODUCER_RUN_ATTEMPT: ${{ needs.candidate.outputs.artifact_producer_run_attempt }}
          SOURCE_EVIDENCE_PATH: ${{ inputs.source_run_id != '' && format('{0}/terminal-evidence/source/evidence.json', runner.temp) || '' }}
          SOURCE_EVIDENCE_SHA256: ${{ needs.validate.outputs.source_evidence_sha256 }}
          SELECTOR: ${{ inputs.selector }}
        shell: bash
        run: |
          status=0
          ruby packaging/release_candidate/hosted_aggregate.rb \
            "$RUNNER_TEMP/terminal-evidence/jobs.json" \
            "$RUNNER_TEMP/terminal-evidence/checks.json" \
            "$RUNNER_TEMP/terminal-evidence/receipts.json" \
            "$RUNNER_TEMP/terminal-evidence/evidence.json" || status=$?
          test -f "$RUNNER_TEMP/terminal-evidence/evidence.json"
          evidence_sha256="$(sha256sum "$RUNNER_TEMP/terminal-evidence/evidence.json" | awk '{print $1}')"
          echo "evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Retain terminal trusted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-release-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Trusted release candidate aggregate
    if: ${{ always() }}
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
    steps:
      - name: Download exact terminal evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hive-release-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
      - name: Verify evidence and publish exact candidate-bound Check Run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_SHA256: ${{ needs.attest.outputs.evidence_sha256 }}
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/terminal-evidence/evidence.json"
          actual="$(sha256sum "$evidence" | awk '{print $1}')"
          test "$actual" = "$EVIDENCE_SHA256"
          test "$(jq -r .candidate_sha "$evidence")" = "$CANDIDATE_SHA"
          qa_status="$(jq -r .qa_status "$evidence")"
          conclusion=failure
          if test "$qa_status" = qa_ready; then
            conclusion=success
          fi
          jq -n \
            --arg name hive-release-candidate \
            --arg head_sha "$CANDIDATE_SHA" \
            --arg conclusion "$conclusion" \
            --arg details_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg external_id "hive-release-candidate:v1:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${EVIDENCE_SHA256}" \
            '{name:$name,head_sha:$head_sha,status:"completed",conclusion:$conclusion,details_url:$details_url,external_id:$external_id}' |
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" --data-binary @-
          test "$qa_status" = qa_ready
