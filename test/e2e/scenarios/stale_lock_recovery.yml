name: stale_lock_recovery
description: Concurrent lock failure produces TEMPFAIL, then marker clear and rerun recover.
tags: [cli-only, recovery]
coverage:
  primary: recovery.stale_lock
  supporting: []
steps:
  - kind: seed_state
    stage: 4-execute
    slug: stale-lock-task
    state_file: task.md
    content: "# Task\n\n<!-- EXECUTE_STALE pass=2 -->\n"
    files:
      - path: plan.md
        content: "# Plan\n\n<!-- COMPLETE -->\n"
      - path: meta.yml
        content: |
          id: 98101
          slug: stale-lock-task
          display_name: Stale lock task
  - kind: ruby_block
    block: |
      path = File.join(sandbox, ".hive-state", "config.yml")
      config = YAML.safe_load(File.read(path))
      config.fetch("claude")["mode"] = "headless"
      File.write(path, config.to_yaml)
  - kind: ruby_block
    block: |
      task_folder = File.join(sandbox, ".hive-state/stages/4-execute", slug)
      @scenario_lease_database, @scenario_lease_repository, @scenario_lock_id =
        hold_task_lease(task_folder)
  - kind: cli
    args: [run, "{slug}", --stage, 4-execute]
    expect_exit: 75
  - kind: ruby_block
    block: |
      task_folder = File.join(sandbox, ".hive-state/stages/4-execute", slug)
      @scenario_lease_repository.release(task_folder, lock_id: @scenario_lock_id)
  - kind: cli
    args: [markers, clear, "{task_dir:4-execute}", --name, EXECUTE_STALE]
  - kind: cli
    args: [run, "{slug}", --stage, 4-execute]
  - kind: ruby_block
    block: |
      task_folder = File.join(sandbox, ".hive-state/stages/4-execute", slug)
      raise "task lease remained held" if @scenario_lease_repository.read(task_folder)
      @scenario_lease_database.disconnect
