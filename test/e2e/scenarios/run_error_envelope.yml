name: run_error_envelope
description: hive run --json against a stale-locked task emits a parseable hive-run ErrorPayload (ok=false, error_kind=concurrent_run, exit_code=75).
tags: [cli-only, error-envelope]
coverage:
  primary: runtime.error_envelope
  supporting: []
steps:
  # Plant a 4-execute task with EXECUTE_STALE so the runner can find it.
  - kind: seed_state
    stage: 4-execute
    slug: error-envelope-task
    state_file: task.md
    content: "# Task\n\n<!-- EXECUTE_STALE pass=2 -->\n"
    files:
      - path: plan.md
        content: "# Plan\n\n<!-- COMPLETE -->\n"
      - path: meta.yml
        content: |
          id: 98102
          slug: error-envelope-task
          display_name: Error envelope task

  # Plant a live lease owned by the test process so `Hive::Lock` raises
  # ConcurrentRunError (TEMPFAIL=75) when `hive run` tries to acquire it.
  - kind: ruby_block
    block: |
      task_folder = File.join(sandbox, ".hive-state/stages/4-execute", slug)
      @scenario_lease_database, @scenario_lease_repository, @scenario_lock_id =
        hold_task_lease(task_folder)

  # The envelope itself: schema validates against hive-run.v1.json, ok=false,
  # error_kind=concurrent_run, exit_code=75. Each json_assert reruns the CLI;
  # we use one assertion per step because the runner supports a single
  # pick/equals pair per json_assert.
  - kind: json_assert
    args: [run, "{slug}", --stage, 4-execute, --json]
    schema: hive-run
    expect_exit: 75
    pick: [ok]
    equals: false

  - kind: json_assert
    args: [run, "{slug}", --stage, 4-execute, --json]
    schema: hive-run
    expect_exit: 75
    pick: [error_kind]
    equals: concurrent_run

  - kind: json_assert
    args: [run, "{slug}", --stage, 4-execute, --json]
    schema: hive-run
    expect_exit: 75
    pick: [error_class]
    equals: ConcurrentRunError

  - kind: json_assert
    args: [run, "{slug}", --stage, 4-execute, --json]
    schema: hive-run
    expect_exit: 75
    pick: [exit_code]
    equals: 75

  - kind: ruby_block
    block: |
      task_folder = File.join(sandbox, ".hive-state/stages/4-execute", slug)
      @scenario_lease_repository.release(task_folder, lock_id: @scenario_lock_id)
      @scenario_lease_database.disconnect
